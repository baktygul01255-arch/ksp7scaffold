<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Урок физики 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Rubik:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: рабочее место учителя у интерактивной доски — слева лента этапов, в центре контент этапа, справа док инструментов, поверх — панели и ручка. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel2:#e4e9ee; --line:#cdd5dd; --fg:#14202b; --muted:#566574;
  --accent:#0b7a75; --accent-fg:#ffffff; --accent-soft:#d3ece9; --warn:#b97800; --warn-soft:#fbefcf;
  --g:#2e9e5b; --y:#e0a800; --r:#d9483b; --shadow:0 6px 24px rgba(20,32,43,.14);
  --f-head:'Rubik','Fira Sans',system-ui,sans-serif; --f-body:'Fira Sans',system-ui,'Segoe UI',sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --z:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a1f; --panel:#16262d; --panel2:#1e323a; --line:#2c444d; --fg:#e8efe9; --muted:#9db0b4;
  --accent:#5fd1c4; --accent-fg:#06211f; --accent-soft:#18403e; --warn:#f0c14b; --warn-soft:#3a3115;
  --g:#47c27c; --y:#f1c21b; --r:#f06a5c; --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a1f; --panel:#16262d; --panel2:#1e323a; --line:#2c444d; --fg:#e8efe9; --muted:#9db0b4;
  --accent:#5fd1c4; --accent-fg:#06211f; --accent-soft:#18403e; --warn:#f0c14b; --warn-soft:#3a3115;
  --g:#47c27c; --y:#f1c21b; --r:#f06a5c; --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:8px;padding-block:8px}
/* top bar */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px}
.btn{min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.btn svg{width:22px;height:22px;flex:none}
.lessonbtn{flex:1 1 280px;min-width:0;justify-content:flex-start;text-align:left}
.lessonbtn span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-family:var(--f-head);font-weight:700;background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:2px 9px;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--panel2);min-height:42px;padding:0 12px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.timer{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:12px;padding:3px 6px;border:1px solid var(--line)}
.timer .t{font-family:var(--f-mono);font-weight:700;font-size:1.6rem;min-width:4.6ch;text-align:center;font-variant-numeric:tabular-nums}
.timer.low .t{color:var(--r)} .timer.done{animation:blink .7s steps(2) infinite}
@keyframes blink{50%{background:var(--warn-soft)}}
.timer .btn{min-height:40px;min-width:40px;padding:0 8px}
/* main grid */
.main{min-height:0;display:grid;grid-template-columns:230px minmax(0,1fr) 64px;gap:8px}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.step{display:grid;grid-template-columns:34px 1fr;gap:2px 10px;align-items:center;text-align:left;border:1px solid transparent;background:transparent;border-radius:12px;padding:8px;min-height:58px}
.step .n{grid-row:span 2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;background:var(--panel2);border:2px solid var(--line)}
.step b{font-weight:600;line-height:1.15}
.step small{color:var(--muted);font-family:var(--f-mono)}
.step[aria-current="step"]{background:var(--accent-soft);border-color:var(--accent)}
.step[aria-current="step"] .n{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.step.done .n{background:var(--g);border-color:var(--g);color:#fff}
.bar{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:auto;flex:none}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto;padding:16px 18px 24px;min-width:0}
.stage h1{font-family:var(--f-head);font-weight:600;font-size:1.5rem;line-height:1.2;margin:0 0 4px;text-wrap:balance}
.stage .sub{color:var(--muted);margin:0 0 14px}
.nav{display:flex;gap:8px;margin-top:18px;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);min-width:0;position:relative}
.card.board{background:var(--bg);border-color:var(--accent);border-width:2px}
.card.t{background:var(--panel2)}
.card h3{margin:0 0 8px;font-family:var(--f-head);font-weight:600;font-size:.82rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;padding-right:44px}
.card.board h3{color:var(--accent)}
.card .zoom{position:absolute;top:6px;right:6px;min-height:36px;min-width:36px;padding:0;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.fig{margin:10px 0}.fig svg{width:100%;max-width:520px;height:auto;display:block}.proj .fig svg{max-width:900px}
.big{font-family:var(--f-head);font-weight:500;font-size:1.6rem;line-height:1.28;text-wrap:balance}
.mid{font-size:1.2rem}
ol.steps,ul.pl{margin:0;padding-left:1.3rem;display:grid;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px;padding:3px 12px;font-weight:500}
.blank{display:inline-block;min-width:3.4em;border-bottom:2px solid var(--fg);vertical-align:baseline;margin:0 2px}
.key{color:var(--accent);font-weight:600}
table.tb{border-collapse:collapse;width:100%}
.tbw{overflow-x:auto}
table.tb th,table.tb td{border:1px solid var(--line);padding:8px 10px;text-align:left;min-width:56px}
table.tb th{background:var(--panel2);font-weight:600}
.tag{font-size:.78rem;font-family:var(--f-mono);border-radius:6px;padding:1px 8px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.tag.lab{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.tag.sor{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.safety{border:2px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:10px 14px;font-weight:500}
.lv{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:.85rem;flex:none}
.task{display:grid;gap:8px}
.task .q{font-size:1.15rem}
.reveal{display:none;border-left:4px solid var(--accent);padding:6px 10px;background:var(--accent-soft);border-radius:0 8px 8px 0}
.reveal.show{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mini{min-height:38px;padding:0 12px;font-size:.92rem}
/* dock */
.dock{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.dock .btn{width:100%;min-height:56px;padding:0;flex-direction:column;gap:2px;font-size:.62rem;line-height:1}
.dock .btn svg{width:26px;height:26px}
/* sheet */
.sheet{position:fixed;top:0;bottom:0;right:0;width:min(560px,100%);background:var(--panel);border-left:2px solid var(--accent);box-shadow:var(--shadow);z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(104%);transition:transform .22s}
.sheet.open{transform:none}
.sheet header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sheet header h2{margin:0;font-family:var(--f-head);font-size:1.15rem;flex:1}
.sheet .body{padding:14px;overflow:auto;flex:1;display:grid;gap:12px;align-content:start}
.sheet.left{right:auto;left:0;border-left:0;border-right:2px solid var(--accent);transform:translateX(-104%)}
.sheet.left.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
input[type=text],input[type=number],input[type=url],textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
textarea{min-height:110px;resize:vertical}
label.l{font-size:.85rem;color:var(--muted);display:block;margin-bottom:4px}
.lessons{display:grid;gap:6px}
.lrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);min-height:56px}
.lrow[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lrow .ln{font-family:var(--f-head);font-weight:700;font-size:1.2rem;text-align:center}
/* draw */
#ink{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none;touch-action:none}
#ink.on{pointer-events:auto;cursor:crosshair}
.pen{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--panel);border:2px solid var(--accent);border-radius:16px;box-shadow:var(--shadow);padding:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 20px)}
.pen[hidden]{display:none}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--line);padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 3px var(--accent)}
/* projection */
.proj{position:fixed;inset:0;z-index:35;background:var(--bg);color:var(--fg);padding:max(18px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 18px max(24px,env(safe-area-inset-left,0px));overflow:auto}
.proj[hidden]{display:none}
.proj .x{position:fixed;top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:2}
.proj .in{max-width:1500px;margin:0 auto;font-size:2.1rem;line-height:1.35}
.proj .in h3{display:none}
.proj .big{font-size:3rem}
.proj .mid{font-size:2.2rem}
/* tools */
.light{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lt{border-radius:18px;border:0;min-height:130px;color:#fff;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:2.6rem;position:relative}
.lt small{font-size:.9rem;font-weight:500;display:block;text-align:center}
.lt.g{background:var(--g)} .lt.y{background:var(--y);color:#2a2000} .lt.r{background:var(--r)}
.dist{display:flex;height:22px;border-radius:11px;overflow:hidden;background:var(--panel2)}
.dist i{display:block;height:100%;transition:width .25s}
.pick{font-family:var(--f-head);font-weight:700;font-size:3.4rem;text-align:center;min-height:5.2rem;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:16px;padding:8px;word-break:break-word;line-height:1.1}
.pick.go{color:var(--muted)}
.grp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel2)}
.grp b{font-family:var(--f-head)}
.crit{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.crit h4{margin:0;font-family:var(--f-head);font-size:1rem}
.dsc{display:grid;grid-template-columns:28px 1fr 34px;gap:8px;align-items:start}
.dsc input{width:22px;height:22px;min-height:0;margin-top:3px;accent-color:var(--accent)}
.dsc .pt{font-family:var(--f-mono);color:var(--muted)}
.score{font-family:var(--f-head);font-size:1.6rem;font-weight:700}
.lvl{display:inline-block;border-radius:999px;padding:2px 14px;font-weight:600;color:#fff}
.lvl.h{background:var(--g)} .lvl.m{background:var(--y);color:#2a2000} .lvl.l{background:var(--r)}
a.lk{color:var(--accent);font-weight:600}
.linkrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.hint{color:var(--muted);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;z-index:60;font-weight:500}
.toast[hidden]{display:none}
/* board mode */
body.boardmode .t{display:none!important}
body.boardmode .stage{font-size:1.2rem}
body.boardmode .stage h1{font-size:2rem}
body.boardmode .big{font-size:2.3rem}
body.boardmode .rail .step small{display:none}

/* board slides */
.bhead{display:flex;align-items:center;gap:14px;flex:none;margin-bottom:10px}
.bhead h1{margin:0;flex:1;font-size:clamp(1.4rem,3.4vh,2.4rem)}
.bhead .bn{width:2.2em;height:2.2em;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:clamp(1rem,2.4vh,1.6rem)}
.bhead .bm{font-family:var(--f-mono);color:var(--muted);font-size:clamp(1rem,2.2vh,1.5rem)}
body.boardmode .stage{display:flex;flex-direction:column;overflow:hidden;padding:12px 16px;font-size:clamp(1.05rem,2.25vh,2rem)}
body.boardmode .stage .nav{flex:none;margin-top:10px}
.slide{flex:1;min-height:0;display:grid;gap:14px}
.slide .card{display:flex;flex-direction:column;min-height:0;overflow:auto;padding:14px 20px}
.slide .card h3{font-size:clamp(.8rem,1.7vh,1.1rem);padding-right:0}
.slide .card .cb{margin:auto 0;width:100%}
.slide .big{font-size:clamp(1.6rem,4.4vh,3.6rem)}
.slide .mid{font-size:clamp(1.1rem,2.55vh,2.2rem)}
.slide .steps li,.slide .pl li{margin-bottom:.35em}
.slide .fig{margin:0}.slide .fig svg{max-width:100%;max-height:100%;width:100%;margin:auto}
.slide .fig.cl svg{max-height:52vh}.slide .fig.sc svg{max-height:40vh}
.fml{display:grid;gap:.5em;font-family:var(--f-mono);font-weight:700;font-size:clamp(1.15rem,2.9vh,2.4rem)}
.fml div{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:.35em .7em}
.simbig{display:flex;justify-content:center;align-items:center;min-height:3.2em;font-size:clamp(1.1rem,2.6vh,2rem);text-decoration:none}
.slide.s0 .mid{font-size:clamp(1rem,2.2vh,1.9rem)}.slide.s0 .big{font-size:clamp(1.3rem,3.1vh,2.6rem)}.slide.s2 .mid{font-size:clamp(1.2rem,2.85vh,2.5rem)}
.slide .card.schc .cb{flex:1;min-height:0;margin:0;display:flex;width:100%}.slide .card.schc .fig{flex:1;min-height:0;display:flex}.slide .card.schc .fig svg{max-height:none;height:100%;width:100%}.slide.s0 .pl{font-size:clamp(.95rem,2vh,1.6rem)}
.slide.s0{grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1.3fr auto;grid-template-areas:"tp tp cl cl cl" "gl gl cl cl cl" "go go go ro ro"}
.slide.s1{grid-template-columns:1.25fr 1fr;grid-template-rows:1fr 1fr;grid-template-areas:"pr dg" "pr hy"}
.slide.s1.vis{grid-template-areas:"pr dg" "vs hy"}
.slide.s2{grid-template-columns:1.15fr 1fr;grid-template-rows:1fr 1fr;grid-template-areas:"lf r1" "lf r2"}
.slide.s2.n1{grid-template-areas:"lf r1" "lf r1"}
.slide.s3{grid-template-columns:1fr 1.1fr;grid-template-rows:1fr 1fr;grid-template-areas:"lf r1" "lf r2"}
.slide.s3.n1{grid-template-areas:"lf r1" "lf r1"}
.slide.s3.sf{grid-template-rows:auto 1fr 1fr;grid-template-areas:"sf sf" "lf r1" "lf r2"}
.slide.s3.sf.n1{grid-template-areas:"sf sf" "lf r1" "lf r1"}
.slide.s4{grid-template-columns:repeat(6,1fr);grid-auto-rows:1fr}
.slide.s4 .q{font-size:clamp(1.1rem,2.6vh,2.1rem)}
.slide.s4.c3 .card{grid-column:span 2}
.slide.s4.c4 .card,.slide.s4.c5 .card:nth-child(n+4){grid-column:span 3}
.slide.s4.c5 .card:nth-child(-n+3){grid-column:span 2}
.slide.s5{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;grid-template-areas:"a b" "c d"}
.slide table{font-size:clamp(.95rem,2.1vh,1.7rem)}.slide td,.slide th{padding:.35em .5em}.slide .hint{font-size:clamp(.9rem,1.9vh,1.4rem)}.slide .btn.mini{font-size:clamp(.85rem,1.9vh,1.3rem);min-height:2.4em;padding:0 .8em}.slide .tag,.slide .lv{font-size:clamp(.8rem,1.8vh,1.2rem)}
.slide .safety{margin:0;align-self:center}
@media (max-width:900px){.slide{display:flex;flex-direction:column;overflow:auto}.slide .card{flex:none}body.boardmode .stage{overflow:auto}}

/* slides */
.sdh{display:flex;align-items:center;gap:14px;flex:none;margin-bottom:10px}
.sdh .bn{width:2.1em;height:2.1em;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:clamp(1rem,2.3vh,1.5rem)}
.sdh b{font-family:var(--f-head);font-size:clamp(1.1rem,2.6vh,1.8rem)}
.sdh .tt{flex:1;text-align:right;color:var(--muted);font-size:clamp(.95rem,2.1vh,1.4rem)}
.sd{flex:1;min-height:0}
.sd.hero{display:flex;flex-direction:column;justify-content:center;gap:4vh;border-radius:14px;padding:4vh 4vw;background:linear-gradient(135deg,var(--accent-soft),var(--bg));border:2px solid var(--accent)}
.sd-hero{display:flex;align-items:center;gap:3vw}
.sd-hero .sdn{font-family:var(--f-head);font-weight:700;font-size:clamp(4rem,18vh,11rem);line-height:1;color:var(--accent);min-width:1.4em;text-align:center}
.sd-hero .kicker{font-size:clamp(1rem,2.4vh,1.7rem);color:var(--muted);margin-bottom:1.2vh;letter-spacing:.04em}
.sd-hero .h{font-family:var(--f-head);font-weight:600;font-size:clamp(1.8rem,5.6vh,4.2rem);line-height:1.12;text-wrap:balance}
.sd-hero .meta{margin-top:2vh;font-size:clamp(1rem,2.4vh,1.7rem);color:var(--muted)}
.sd-foot{font-size:clamp(.9rem,1.9vh,1.3rem);color:var(--muted);border-top:1px solid var(--line);padding-top:1.4vh}
.sdh3{margin:0 0 8px;font-family:var(--f-head);font-size:clamp(.8rem,1.7vh,1.1rem);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.slide.sd.c1{grid-template-columns:1fr}
.slide.sd.c2{grid-template-columns:1fr 1fr}
.slide.sd.c3{grid-template-columns:repeat(3,1fr)}
.slide.sd.c12{grid-template-columns:1.2fr 1fr}
.slide.sd.map{grid-template-columns:1fr}
.slide.sd.sf{grid-template-rows:auto 1fr}
.slide.sd.c1 .big{font-size:clamp(1.8rem,5.2vh,4.4rem)}
.slide.sd.c1 .mid,.slide.sd.c1 .q{font-size:clamp(1.25rem,3.1vh,2.6rem)}
.slide.sd.c3 .pl{font-size:clamp(1.05rem,2.4vh,2rem)}

<script>
const DATA = {"ru":{"meta":{"goalPre":"К концу урока (за 45 минут) каждый ученик ","goalPost":", пользуясь подсказками, уровень которых выберет сам.","s1":["Приветствует класс, проверяет готовность. Делит класс на группы по 4 человека (цветные карточки). Раздаёт карточки ролей: докладчик, экспериментатор, оформитель, контролёр техники безопасности.","Занимают места в группах, распределяют роли, проверяют наличие учебных принадлежностей."],"levels":"Высокий уровень: 9–11 баллов; средний: 6–8 баллов; низкий: 0–5 баллов.","tools":[["«Две звезды и одно пожелание»","Две сильные стороны работы соседней группы и одно предложение, что улучшить."],["«Плюс – минус – интересно»","Что получилось хорошо; что можно улучшить; что оказалось интересным."],["Самоанализ на стикере",["1. Что мне удалось?","2. Что было трудно?","3. Какая подсказка мне помогла?","4. Что мне нужно доработать?"]],["«Светофор»","Зелёный – понял тему; жёлтый – понял частично; красный – нужна помощь. Показывается в начале и в конце урока."]],"teacher":"Байсельдинова Б.Б.","cls":"7 «Б»","org":"ГУ «Комплекс «Музыкальный колледж – музыкальная школа-интернат для одаренных детей»"},"lessons":[{"n":1,"q":1,"sec":"Физика – наука о природе (1 ч)","topic":"Физика – наука о природе. Научные методы изучения природы","kind":"std","sn":0,"times":[3,7,9,11,12,3],"goals":[["7.1.1.1","приводить примеры физических явлений"],["7.1.1.2","различать научные методы изучения природы"]],"smart":"приведёт не менее трёх примеров физических явлений, различит наблюдение и опыт (эксперимент) как методы изучения природы и определит метод по описанию в трёх ситуациях","hook":"Демонстрирует три мини-опыта: падение скомканного и расправленного листа бумаги, притяжение кусочков бумаги пластиковой линейкой, натёртой о шерсть, нагревание воды в стакане.","problem":"Как люди узнают законы природы: только наблюдая или как-то иначе?","d":["приведите пример явления природы","что такое наблюдение","чем опыт отличается от наблюдения"],"model":["Рассуждает вслух над мини-опытами: «Падение листа – механическое явление; линейка притягивает бумажки – электрическое; вода нагревается – тепловое».","Показывает на схеме путь познания: наблюдение → гипотеза → опыт (эксперимент) → вывод → теория (модель) и называет, какой метод применён в каждом случае."],"kw":"«физическое явление», «наблюдение», «опыт (эксперимент)», «гипотеза»","grpT":["Раздаёт карточки с десятью ситуациями (гроза, нагревание воды, падение яблока, радуга, звон колокольчика и др.) и лист «Классификация»: определить вид явления и метод его изучения.","Предлагает проверить гипотезу «форма тела влияет на падение»: скомканный и расправленный лист бумаги."],"grpS":["Классифицируют явления (механические, тепловые, электрические, световые, звуковые) и определяют метод познания по описанию.","Проводят мини-опыт, записывают гипотезу, наблюдение и вывод по заготовке: «Мы предположили, что …; опыт показал, что …»."],"A":["1. Всё, что происходит в природе, называется ____ . Явления, которые изучает физика, называются ____ явлениями.","2. Виды физических явлений: ____ , тепловые, ____ , световые, звуковые.","3. Основные методы изучения природы: ____ (изучение явления без вмешательства) и ____ (явление воспроизводят в заданных условиях).","4. Порядок научного познания: наблюдение → ____ → опыт → ____ ."],"Akey":["1. явлениями природы; физическими.","2. механические; электрические.","3. наблюдение; опыт (эксперимент).","4. гипотеза; вывод."],"B":{"title":"Мини-опыт «Влияет ли форма тела на падение?»","equip":"два одинаковых листа бумаги, секундомер.","safety":"не бросать предметы в одноклассников.","steps":["Запишите гипотезу: «Скомканный лист падает … расправленного».","Один лист скомкайте, другой оставьте расправленным.","Одновременно отпустите листы с высоты вытянутой руки (три попытки).","Запишите, какой лист упал раньше.","Сделайте вывод."],"head":["Попытка","Какой лист упал раньше","Вывод наблюдения"],"rows":[["1","",""],["2","",""],["3","",""]],"frame":"«Мы предположили, что …; опыт показал, что …; значит, форма тела … на падение.»"},"keyB":"Скомканный лист падает быстрее; форма тела влияет на падение (сопротивление воздуха). Использован метод «опыт», гипотеза проверена.","ex":{"q":"Учёный много дней записывает, когда замерзает вода в реке.","sol":"Метод – наблюдение: явление изучают без вмешательства.","a":"наблюдение"},"tasks":[{"q":"Определите метод: ученик двое суток записывает температуру воздуха по термометру за окном.","hint":"Подсказка: вмешиваемся ли мы в явление? Образец: «Метод – …, потому что …».","sol":"наблюдение (мы не вмешиваемся, только записываем)","a":"наблюдение"},{"q":"Ученик нагревает воду в стакане и меняет мощность нагревателя, измеряя температуру каждую минуту. Назовите метод и вид явления.","hint":"Подсказка: если условия меняют сами – это опыт; нагревание – тепловое явление.","sol":"опыт (эксперимент); тепловое явление","a":"опыт; тепловое"},{"q":"Составьте план проверки гипотезы «тяжёлый шарик падает быстрее лёгкого»: что вы измерите и что оставите одинаковым?","hint":"","sol":"Бросать шарики с одной высоты и измерять время падения; одинаковыми оставить высоту и размер шариков; вывод сделать по результатам.","a":"план опыта"}],"ch":{"q":"Приведите по одному примеру механического, теплового, светового и звукового явлений из быта.","ans":"например: катится мяч; тает лёд; радуга; звонит колокол."},"real":"Метеорология (прогноз по наблюдениям), медицина (клинические испытания – опыт), техника (проверка новых материалов).","hw":"параграф учебника + задание на выбор: уровень 1 – привести 3 примера явлений дома; уровень 2 – 5 примеров с указанием вида явления; уровень 3 – описать один домашний опыт по схеме «гипотеза – опыт – вывод».","ansProb":"законы природы узнают и наблюдением, и опытом: наблюдение даёт факты и гипотезу, опыт её проверяет, затем делают вывод.","concl":"форма тела влияет на падение; гипотеза проверена опытом","peer":"stars","meth":["Обучение в сотрудничестве","Обучение в игровой форме"],"sim":"","crit":[{"t":"Объясняет и формулирует (понимание темы)","d":["приводит не менее трёх примеров физических явлений;","различает наблюдение и опыт (эксперимент);","называет этапы познания: наблюдение, гипотеза, опыт, вывод."]},{"t":"Применяет знания при решении задач","d":["задание 1: выполняет по образцу, получает верный ответ (наблюдение);","задание 2: выбирает верный способ решения (формулу), при необходимости переводит единицы;","задание 2: получает верный ответ (опыт; тепловое);","задание 3: выбирает верный способ решения;","задание 3: получает верный ответ (план опыта)."]},{"t":"Работает в группе и делает вывод","d":["выполняет свою роль в группе;","фиксирует результат группы в листе задания;","делает вывод: форма тела влияет на падение; гипотеза проверена опытом"]}]},{"n":2,"q":1,"sec":"Физические величины и измерения (4 ч)","topic":"Международная система единиц (СИ). Скалярные и векторные физические величины","kind":"std","sn":0,"times":[3,7,9,11,12,3],"goals":[["7.1.2.1","соотносить физические величины с их единицами измерения Международной системы единиц"],["7.1.2.2","различать скалярные и векторные физические величины и приводить примеры"]],"smart":"соотнесёт физические величины с единицами СИ, различит скалярные и векторные величины и приведёт примеры каждого вида","hook":"Просит двух учеников измерить длину парты своими шагами: результаты получаются разными. Показывает линейку с сантиметрами и дюймами.","problem":"Почему для измерений нужна единая система единиц?","d":["назовите единицу длины","что такое физическая величина","приведите пример величины, у которой есть направление"],"model":["Рассуждает вслух: «Шаги у людей разные, поэтому результаты разные; для всех стран принята Международная система единиц (СИ): метр (м), килограмм (кг), секунда (с)» – и показывает таблицу основных единиц СИ.","Различает скаляры и векторы на примерах: «Масса 5 кг – достаточно числа, это скаляр; скорость 5 м/с вправо – нужны число и направление, это вектор»; изображает вектор стрелкой."],"kw":"«СИ», «основные единицы», «скаляр», «вектор»","grpT":["Выдаёт набор карточек с величинами (масса, путь, перемещение, скорость, время, сила, температура) и единицами (кг, м, с, Н, К, м/с).","Просит сопоставить величину и единицу СИ и разложить величины на «скаляры» и «векторы»."],"grpS":["Сопоставляют величину и её единицу в СИ, обсуждают спорные случаи (температура, путь).","Раскладывают карточки на две группы и обосновывают: «Это вектор, потому что нужно указать направление»."],"A":["1. Единая система единиц называется ____ . Основная единица длины – ____ , массы – ____ , времени – ____ .","2. Величина, которую полностью описывает число, называется ____ (например, ____ ).","3. Величина, у которой есть число и ____ , называется векторной (например, ____ ).","4. Вектор изображают ____ ."],"Akey":["1. Международная система единиц (СИ); метр (м); килограмм (кг); секунда (с).","2. скалярной; масса, время, температура, путь.","3. направление; скорость, сила, перемещение.","4. стрелкой (направленным отрезком)."],"B":{"title":"Классификация величин","steps":["Сопоставьте каждую величину с единицей СИ.","Заполните таблицу.","Отметьте, какие величины векторные.","Объясните выбор одной величины."],"head":["Величина","Единица СИ","Скаляр или вектор","Почему"],"rows":[["Масса","","",""],["Путь","","",""],["Скорость","","",""],["Сила","","",""],["Температура","","",""]],"frame":"«Векторные величины отличаются от скалярных тем, что …»"},"keyB":"Масса – кг – скаляр; путь – м – скаляр; скорость – м/с – вектор; сила – Н – вектор; температура – К (°C) – скаляр. У векторных величин есть направление.","ex":{"q":"Скорость автомобиля 20 м/с на север. Скаляр или вектор? Единица СИ?","sol":"Вектор: указаны число и направление. Единица СИ – м/с.","a":"вектор, м/с"},"tasks":[{"q":"Масса тела 3 кг. К какому виду относится величина и какая у неё единица СИ?","hint":"Образец: «Масса – …, потому что направление не нужно; единица – …».","sol":"скаляр; кг","a":"скаляр, кг"},{"q":"Определите вид и единицу СИ: а) перемещение 4 м на восток; б) время 30 с; в) сила 10 Н вниз.","hint":"Подсказка: есть ли в записи направление?","sol":"а) вектор, м; б) скаляр, с; в) вектор, Н","a":"вектор; скаляр; вектор"},{"q":"Приведите по два примера скалярных и векторных величин и объясните, как изображается вектор силы.","hint":"","sol":"Скаляры: масса, время; векторы: сила, скорость; вектор – стрелка, её длина пропорциональна значению, направление совпадает с направлением действия.","a":"примеры и стрелка"}],"ch":{"q":"Почему путь – скаляр, а перемещение – вектор?","ans":"путь – длина траектории, направление не нужно; перемещение – направленный отрезок от начала до конца движения."},"real":"Навигация (скорость и курс судна – вектор), метеорология (скорость ветра – вектор, температура – скаляр), торговля (единые единицы массы и длины).","hw":"параграф учебника + таблица величин: уровень 1 – 5 величин по образцу; уровень 2 – 7 величин; уровень 3 – 7 величин и пример из быта для каждой.","ansProb":"единая система нужна, чтобы результаты измерений в разных странах и лабораториях можно было сравнивать.","concl":"у векторных величин есть направление, у скалярных – только числовое значение","peer":"pmi","meth":["Обучение в игровой форме","Обучение в сотрудничестве"],"sim":"","crit":[{"t":"Объясняет и формулирует (понимание темы)","d":["называет основные единицы СИ (м, кг, с);","отличает скалярные величины от векторных;","объясняет, как изображается вектор."]},{"t":"Применяет знания при решении задач","d":["задание 1: выполняет по образцу, получает верный ответ (скаляр, кг);","задание 2: выбирает верный способ решения (формулу), при необходимости переводит единицы;","задание 2: получает верный ответ (вектор; скаляр; вектор);","задание 3: выбирает верный способ решения;","задание 3: получает верный ответ (примеры и стрелка)."]},{"t":"Работает в группе и делает вывод","d":["выполняет свою роль в группе;","фиксирует результат группы в листе задания;", , см","Перемещение, см","Путь больше перемещения?"],"rows":[["1 (дуга)","","",""],["2 (ломаная)","","",""]],"frame":"«Путь равен модулю перемещения только тогда, когда …»"},"keyB":"Путь больше модуля перемещения при криволинейной траектории; они равны при прямолинейном движении в одном направлении.","ex":{"q":"Тело прошло по полуокружности радиусом 2 м. Найдите путь и модуль перемещения.","sol":"s = πr ≈ 3,14 · 2 = 6,28 м; модуль перемещения 2r = 4 м.","a":"6,28 м; 4 м"},"tasks":[{"q":"Автобус проехал 3 км на восток, затем вернулся на 1 км на запад. Найдите путь и перемещение.","hint":"Заготовка: s = ___ + ___ = ___ км; перемещение = ___ − ___ = ___ км.","sol":"s = 3 + 1 = 4 км; перемещение 3 − 1 = 2 км на восток","a":"4 км; 2 км"},{"q":"Спортсмен пробежал два полных круга по стадиону, длина круга 400 м. Найдите путь и перемещение.","hint":"Подсказка: где спортсмен оказался в конце бега?","sol":"s = 2 · 400 = 800 м; перемещение 0 (вернулся в начальную точку)","a":"800 м; 0"},{"q":"Объясните, относительно каких тел пассажир автобуса покоится и относительно каких движется.","hint":"","sol":"покоится относительно автобуса и других пассажиров; движется относительно дороги и зданий","a":"относительность"}],"ch":{"q":"Приведите пример, когда путь тела больше нуля, а перемещение равно нулю.","ans":"тело вернулось в начальную точку, например бег по кругу стадиона."},"real":"Навигация и транспорт (маршруты, пройденный путь), спорт (дистанция и перемещение), GPS-трекеры.","hw":"параграф учебника + задача: уровень 1 – путь и перемещение по прямой; уровень 2 – по маршруту вдоль одной прямой туда и обратно; уровень 3 – ещё и два примера относительности движения.","ansProb":"покой и движение относительны: пассажир покоится относительно автобуса, но движется относительно дороги.","concl":"путь не меньше модуля перемещения; покой и движение относительны","peer":"stars","meth":["Обучение в сотрудничестве"],"sim":"moving-man","crit":[{"t":"Объясняет и формулирует (понимание темы)","d":["объясняет понятие «система отсчёта»;","различает траекторию, путь и перемещение;","приводит пример относительности движения."]},{"t":"Применяет знания при решении задач","d":["задание 1: выполняет по образцу, получает верный ответ (4 км; 2 км);","задание 2: выбирает верный способ решения (формулу), при необходимости переводит единицы;","задание 2: получает верный ответ (800 м; 0);","задание 3: выбирает верный способ решения;","задание 3: получает верный ответ (относительность)."]},{"t":"Работает в группе и делает вывод","d":["выполняет свою роль в группе;","фиксирует результат группы в листе задания;","делает вывод: путь не меньше модуля перемещения; покой и движение относительны"]}]},{"n":7,"q":1,"sec":"Механическое движение (4 ч)","topic":"Прямолинейное равномерное и неравномерное движение. Расчёт скорости, средней скорости","kind":"std","sn":0,"times":[3,7,9,11,12,3],"goals":[["7.2.1.3","различать прямолинейное равномерное и неравномерное движение"],["7.2.1.4","вычислять скорость и среднюю скорость движения тел"]],"smart":"различит равномерное и неравномерное движение, вычислит скорость и среднюю скорость и переведёт скорость из км/ч в м/с","hook":"Запускает игрушечную машинку по столу: ученики отмечают её положение мелом через равные промежутки времени (каждые 2 с) при равномерном движении и при торможении.","problem":"Как сравнить, кто движется быстрее, если один прошёл больший путь, а другой потратил меньше времени?","d":["что такое путь","формула скорости","в каких единицах измеряют скорость"],"model":["Вводит понятия: при равномерном прямолинейном движении тело за равные промежутки времени проходит равные пути, скорость постоянна: v = s : t. Единица СИ – м/с; 1 км/ч = 1000 м : 3600 с = 1 : 3,6 м/с, поэтому 36 км/ч = 10 м/с.","Для неравномерного движения вводит среднюю скорость v_{ср} = s : t (весь путь делят на всё время). Пример: 90 км за 1 ч и 60 км за 2 ч: v_{ср} = 150 км : 3 ч = 50 км/ч, а не среднее арифметическое 60 км/ч."],"kw":"«равномерное», «неравномерное», «скорость», «средняя скорость»","grpT":["Выдаёт лист с таблицей «время – путь» на трёх участках: определить вид движения, вычислить скорость на участках и среднюю скорость на всём пути.","Раздаёт карточки скоростей (36, 54, 72 км/ч) для перевода в м/с."],"grpS":["Анализируют таблицу, вычисляют v = s : t на участках и v_{ср} на всём пути.","Переводят скорости из км/ч в м/с и обратно, сравнивают результаты."],"A":["1. При ____ движении тело за любые равные промежутки времени проходит ____ пути.","2. Скорость v = s : ____ ; единица скорости в СИ – ____ .","3. Средняя скорость v_{ср} = ____ : ____ (весь путь делят на всё время).","4. Перевод: 1 км/ч = ____ м/с, 1 м/с = ____ км/ч."],"Akey":["1. равномерном; равные.","2. t; м/с.","3. s (весь путь); t (всё время).","4. 1/3,6 (≈ 0,28); 3,6."],"B":{"title":"Анализ таблицы движения","steps":["Рассмотрите таблицу: время и путь на трёх участках.","Вычислите скорость на каждом участке.","Определите вид движения на участках и в целом.","Найдите среднюю скорость на всём пути."],"head":["Участок","Путь s, м","Время t, с","Скорость v, м/с"],"rows":[["1","20","4",""],["2","30","6",""],["3","10","10",""],["Весь путь","","",""]],"frame":"«На участках 1 и 2 движение …, а на всём пути …»"},"keyB":"v_{1} = 5 м/с, v_{2} = 5 м/с, v_{3} = 1 м/с; весь путь 60 м за 20 с, v_{ср} = 3 м/с; на участках 1–2 движение равномерное, в целом неравномерное.","ex":{"q":"Велосипедист проехал 600 м за 100 с. Найдите скорость.","sol":"v = 600 : 100 = 6 м/с.","a":"6 м/с"},"tasks":[{"q":"Поезд прошёл 180 км за 3 ч. Найдите скорость в км/ч.","hint":"Заготовка: v = s : t = ___ : ___ = ___ км/ч.","sol":"v = 180 : 3 = 60 км/ч","a":"60 км/ч"},{"q":"Выразите 72 км/ч в м/с и найдите путь за 5 с при такой скорости.","hint":"Подсказка: 72 км/ч = 72 : 3,6 м/с; s = v · t.","sol":"72 км/ч = 20 м/с; s = 20 · 5 = 100 м","a":"20 м/с; 100 м"},{"q":"Первые 2 ч автомобиль ехал со скоростью 60 км/ч, следующий час – со скоростью 90 км/ч. Найдите среднюю скорость.","hint":"","sol":"s = 60 · 2 + 90 · 1 = 210 км; t = 3 ч; v_{ср} = 210 : 3 = 70 км/ч","a":"70 км/ч"}],"ch":{"q":"Почему средняя скорость не равна среднему арифметическому скоростей на участках? Приведите числовой пример.","ans":"время движения на участках разное; пример: 90 км/ч в течение 1 ч и 30 км/ч в течение 2 ч дают v_{ср} = 150 : 3 = 50 км/ч, а не 60 км/ч."},"real":"Расписание поездов и автобусов, спидометр и навигатор, спортивная статистика (средняя скорость бегуна).","hw":"параграф учебника + задача: уровень 1 – найти скорость по s и t; уровень 2 – с переводом км/ч в м/с; уровень 3 – найти среднюю скорость на двух участках.","ansProb":"быстрее движется тот, у кого больше скорость v = s : t, а не тот, кто прошёл больший путь.","concl":"при неравномерном движении используют среднюю скорость: весь путь делят на всё время","peer":"pmi","meth":["Обучение в сотрудничестве"],"sim":"moving-man","crit":[{"t":"Объясняет и формулирует (понимание темы)","d":["различает равномерное и неравномерное движение;","записывает формулы скорости и средней скорости;","объясняет перевод км/ч в м/с."]},{"t":"Применяет знания при решении задач","d":["задание 1: выполняет по образцу, получает верный ответ (60 км/ч);","задание 2: выбирает верный способ решения (формулу), при необходимости переводит единицы;","задание 2: получает верный ответ (20 м/с; 100 м);","задание 3: выбирает верный способ решения;","задание 3: получает верный ответ (70 км/ч)."]},{"t":"Работает в группе и делает вывод","d":["выполняет свою роль в группе;","фиксирует результат группы в листе задания;","делает вывод: при неравномерном движении используют среднюю скорость: весь путь делят на всё время"]}]},{"n":8,"q":1,"sec":"Механическое движение (4 ч)","topic":"Графическое представление различных видов механического движения (СОР №2)","kind":"sor","sn":2,"times":[3,4,6,8,20,4],"goals":[["7.2.1.5","строить график зависимости s от t, применяя обозначение единиц измерения на координатных осях графиков и в таблицах"]],"smart":"построит график зависимости пути от времени с подписанными осями и единицами, прочитает по нему скорость и путь и выполнит суммативную работу","hook":"Показывает на слайде график движения велосипедиста без подписей осей и спрашивает, что на нём не так.","problem":"Что рассказывает график о движении тела и что нужно указать на нём, чтобы его смогли прочитать другие?","d":["что откладывают по горизонтальной оси на графике s(t)","формула скорости","какая линия получается для равномерного движения"],"model":["Строит график вслух по таблице (t, с: 0, 2, 4, 6; s, м: 0, 4, 8, 12): «По горизонтальной оси откладываю время t (с), по вертикальной – путь s (м); выбираю масштаб, ставлю точки, провожу прямую через начало координат».","Показывает чтение графика: v = s : t = 12 м : 6 с = 2 м/с; чем круче прямая, тем больше скорость; горизонтальный участок – тело стоит."],"kw":"«ось», «масштаб», «единицы на осях», «наклон графика»","grpT":["Выдаёт таблицу данных двух тел и миллиметровую бумагу: построить оба графика на одних осях, подписать оси и единицы.","Просит определить по графикам, какое тело быстрее, и найти путь каждого за 5 с."],"grpS":["Выбирают масштаб, строят графики s(t), подписывают оси с единицами измерения.","Определяют скорости по графикам, сравнивают их и находят путь за 5 с."],"A":["1. На графике s(t) по горизонтальной оси откладывают ____ , по вертикальной – ____ .","2. Обе оси подписывают, указывая ____ измерения, и выбирают удобный ____ .","3. График равномерного движения – ____ линия, начинающаяся в начале координат (если s_{0} = 0).","4. Чем ____ график, тем больше скорость тела; горизонтальный участок означает, что тело ____ ."],"Akey":["1. время t; путь s.","2. единицы; масштаб.","3. прямая.","4. круче; стоит (покоится)."],"B":{"title":"Построение графика s(t)","steps":["Заполните таблицу значениями из задания.","Выберите масштаб и подпишите оси с единицами.","Нанесите точки и проведите прямые.","Найдите по графикам скорости и путь за 5 с."],"head":["t, с","s_{1}, м (тело 1)","s_{2}, м (тело 2)"],"rows":[["0","0","0"],["2","4","6"],["4","8","12"],["6","12","18"]],"frame":"«У второго тела график …, значит, его скорость …»"},"keyB":"v_{1} = 2 м/с, v_{2} = 3 м/с; график второго тела круче, его скорость больше; за 5 с тела проходят 10 м и 15 м.","ex":null,"tasks":[{"q":"По таблице (t, с: 0, 1, 2, 3; s, м: 0, 5, 10, 15) постройте график s(t), подпишите оси и единицы, найдите скорость.","hint":"","sol":"прямая через начало координат; оси подписаны t, с и s, м; v = 5 м/с","a":"v = 5 м/с"},{"q":"График – прямая через начало координат и точку (4 с; 12 м). Найдите скорость и путь за 10 с.","hint":"","sol":"v = 12 : 4 = 3 м/с; s = 3 · 10 = 30 м","a":"3 м/с; 30 м"},{"q":"Тело 1 за 6 с проходит 18 м, тело 2 – 12 м. У какого тела график круче? Найдите разницу скоростей.","hint":"","sol":"v_{1} = 3 м/с, v_{2} = 2 м/с; круче у тела 1; разница 1 м/с","a":"тело 1; 1 м/с"}],"ch":null,"real":"Графики в спортивной аналитике, приложения-трекеры (график пройденного пути), метеорология и экономика (графики зависимостей).","hw":"повторить §6–8; уровень 1 – построить график по готовой таблице; уровень 2 – ещё и найти скорость; уровень 3 – построить график по собственным измерениям (шаги за время).","ansProb":"график показывает, как путь зависит от времени; чтобы его прочитали другие, нужно подписать оси, указать единицы и масштаб.","concl":"график равномерного движения – прямая; чем она круче, тем больше скорость","peer":"check","meth":["Обучение в сотрудничестве"],"sim":"moving-man","crit":[{"t":"Объясняет и формулирует (понимание темы)","d":["называет, что откладывают по осям;","указывает единицы и масштаб на осях;","объясняет, как по наклону графика сравнить скорости."]},{"t":"Применяет знания при решении задач","d":["задание 1: выполняет по образцу, получает верный ответ (v = 5 м/с);","задание 2: выбирает верный способ решения (формулу), при необходимости переводит единицы;","задание 2: получает верный ответ (3 м/с; 30 м);","задание 3: выбирает верный способ решения;","задание 3: получает верный ответ (тело 1; 1 м/с)."]},{"t":"Работает в группе и делает вывод","d":["выполняет свою роль в группе;","фиксирует результат группы в листе задания;","делает вывод: график равномерного движения – прямая; чем она круче, тем больше скорость"]}]},{"n":9,"q":2,"sec":"Плотность (3 ч)","topic":"Масса и измерение массы тел. Измерение объёма тел правильной и неправильной формы","kind":"std","sn":0,"times":[3,7,9,11,12,3],"goals":[["7.2.2.11","измерять массу тела с использованием электронных, пружинных и рычажных весов"],["7.2.2.12","использовать измерительный цилиндр (мензурка) для измерения объема жидкости или твердого тела различной формы"]],"smart":"измерит массу тела на весах и объём тела правильной и неправильной формы мензуркой и запишет результаты с единицами и погрешностью","hook":"Показывает два одинаковых по размеру предмета (пластиковый и металлический кубики) и просит определить на ощупь, какой «тяжелее»; затем кладёт их на рычажные весы.","problem":"Как точно измерить массу и объём тела, если у него неправильная форма?","d":["в каких единицах измеряют массу","что такое объём","как найти цену деления мензурки"],"model":["Показывает взвешивание на рычажных весах: «Кладу тело на левую чашу, гири – на правую, уравновешиваю; масса тела равна сумме масс гирь: m = 50 г + 10 г + 2 г = 62 г». Называет виды весов: рычажные, пружинные, электронные.","Показывает измерение объёма: объём куба V = a³; для камня – по вытеснению воды: V = V₂ − V₁ = 58 мл − 40 мл = 18 мл = 18 см³ (1 мл = 1 см³)."],"kw":"«масса», «весы», «объём», «мензурка», «вытеснение воды»","grpT":["Раздаёт наборы: весы, гири, мензурка с водой, тела правильной (брусок) и неправильной (камень) формы.","Просит измерить массу и объём каждого тела, записать результаты с единицами в СИ (кг, м³)."],"grpS":["Взвешивают тела, измеряют объём бруска по размерам и камня по вытеснению воды, заполняют таблицу.","Переводят единицы: г → кг, см³ → м³, и проверяют результат друг у друга."],"A":["1. Масса тела – физическая величина, мера ____ тела; единица массы в СИ – ____ .","2. При взвешивании на рычажных весах тело кладут на ____ чашу, а гири – на ____ чашу.","3. Объём тела неправильной формы V = V₂ − V₁, где V₁ – объём воды, V₂ – объём воды с ____ .","4. 1 мл = 1 ____ ; 1 м³ = ____ см³."],"Akey":["1. инертности; килограмм (кг).","2. левую; правую.","3. телом.","4. см³; 1 000 000."],"B":{"title":"Измерение массы и объёма тел","equip":"весы с гирями, мензурка с водой, брусок, камень на нити.","safety":"стеклянную мензурку держать у стола, воду не проливать, гири брать только пинцетом.","steps":["Определите цену деления весов (наименьшая гиря) и мензурки.","Взвесьте брусок и камень.","Найдите объём бруска по размерам, объём камня – по вытеснению воды.","Запишите результаты в таблицу в СИ."],"head":["Тело","Масса m, г","Объём V, см³","m, кг","V, м³"],"rows":[["Брусок","","","",""],["Камень","","","",""]],"frame":"«Объём тела неправильной формы можно найти, потому что тело вытесняет …»"},"keyB":"Объём тела неправильной формы равен объёму вытесненной воды: V = V₂ − V₁. Единицы переводят в СИ: 1 г = 0,001 кг, 1 см³ = 10⁻⁶ м³.","ex":{"q":"Уровень воды в мензурке 30 мл, после погружения тела – 45 мл. Найдите объём тела в см³ и м³.","sol":"V = 45 − 30 = 15 мл = 15 см³ = 1,5·10⁻⁵ м³.","a":"15 см³ = 1,5·10⁻⁵ м³"},"tasks":[{"q":"На левой чаше весов тело, на правой – гири 100 г, 20 г и 5 г. Чему равна масса тела в г и кг?","hint":"Заготовка: m = ___ + ___ + ___ = ___ г = ___ кг.","sol":"m = 100 + 20 + 5 = 125 г = 0,125 кг","a":"125 г = 0,125 кг"},{"q":"Размеры бруска: 5 см, 4 см, 2 см. Найдите объём в см³ и м³.","hint":"Подсказка: V = a · b · c; 1 см³ = 10⁻⁶ м³.","sol":"V = 5 · 4 · 2 = 40 см³ = 4·10⁻⁵ м³","a":"40 см³ = 4·10⁻⁵ м³"},{"q":"Цена деления мензурки 5 мл. Уровень воды 120 мл, с телом – 165 мл. Найдите объём тела и запишите результат с погрешностью.","hint":"","sol":"V = 165 − 120 = 45 мл = 45 см³; Δ = 2,5 мл; V = (45 ± 3) см³","a":"(45 ± 3) см³"}],"ch":{"q":"Как измерить объём тела неправильной формы, которое не помещается в мензурку?","ans":"использовать отливной стакан: измерить объём вытесненной воды в мензурке."},"real":"Торговля (взвешивание товаров), медицина (дозировка по массе), кулинария (мерные стаканы), строительство (расчёт объёма материалов).","hw":"параграф учебника + задания: уровень 1 – перевести массы и объёмы в СИ; уровень 2 – найти объём тела по вытеснению воды; уровень 3 – измерить объём картофелины мерным стаканом и записать с погрешностью.","ansProb":"объём тела неправильной формы находят по вытеснению воды: он равен разности показаний мензурки.","concl":"объём тела неправильной формы равен объёму вытесненной жидкости","peer":"stars","meth":["Лабораторный метод обучения","Обучение в сотрудничестве"],"sim":"density","crit":[{"t":"Объясняет и формулирует (понимание темы)","d":["называет единицы массы и объёма в СИ;","измеряет массу на весах и объём мензуркой;","переводит единицы измерения в СИ."]},{"t":"Применяет знания при решении задач","d":["задание 1: выполняет по образцу, получает верный ответ (125 г = 0,125 кг);","задание 2: выбирает верный способ решения (формулу), при необходимости переводит единицы;","задание 2: получает верный ответ (40 см³ = 4·10⁻⁵ м³);","задание 3: выбирает верный способ решения;","задание 3: получает верный ответ ((45 ± 3) см³)."]},{"t":"Работает в группе и делает вывод","d":["выполняет свою роль в группе;","фиксирует результат группы в листе задания;","делает вывод: объём тела неправильной формы равен объёму вытесненной жидкости"]}]},{"n":10,"q":2,"sec":"Плотность (3 ч)","topic":"Плотность вещества и единицы измерения плотности. Расчёт плотности (СОР №3)","kind":"sor","sn":3,"times":[3,4,6,8,20,4],"goals":[["7.2.2.13","объяснять физический смысл плотности"],["7.2.2.15","применять формулу плотности при решении задач"]],"smart":"объяснит физический смысл плотности, применит формулу ρ = m : V для расчёта плотности, массы и объёма и выполнит суммативную работу","hook":"Показывает два одинаковых по объёму сосуда: с водой и с растительным маслом, а также кубики из алюминия и пенопласта; просит сравнить «тяжесть» одинаковых объёмов.","problem":"Почему тела одинакового объёма имеют разную массу и как это описать числом?","d":["что такое масса","что такое объём","как перевести г в кг"],"model":["Вводит величину: «Плотность показывает, какова масса вещества в единице объёма: ρ = m : V». Единица СИ – кг/м³; 1 г/см³ = 1000 кг/м³. Пример: 1 м³ воды имеет массу 1000 кг, значит ρ = 1000 кг/м³.","Решает задачу вслух: «Алюминиевый брусок m = 540 г, V = 200 см³. ρ = 540 : 200 = 2,7 г/см³ = 2700 кг/м³. Масса: m = ρV, объём: V = m : ρ»."],"kw":"«плотность», «ρ = m : V», «кг/м³», «г/см³»","grpT":["Раздаёт таблицу плотностей и карточки-задачи на расчёт плотности, массы и объёма.","Просит определить по таблице вещество по рассчитанной плотности и объяснить, почему плотность не зависит от размеров тела."],"grpS":["Решают задачи по формулам ρ = m : V, m = ρV, V = m : ρ, переводят г/см³ в кг/м³.","Определяют вещество по таблице плотностей и объясняют вывод."],"A":["1. Плотность вещества – это масса ____ объёма вещества: ρ = ____ .","2. Единица плотности в СИ – ____ ; 1 г/см³ = ____ кг/м³.","3. Масса тела m = ____ · V, объём V = m : ____ .","4. Плотность воды равна ____ кг/м³."],"Akey":["1. единицы; m : V.","2. кг/м³; 1000.","3. ρ; ρ.","4. 1000."],"B":{"title":"Расчёт плотности и определение вещества","steps":["Вычислите плотность каждого тела по формуле ρ = m : V.","Переведите результат в кг/м³.","Найдите вещество по таблице плотностей.","Сделайте вывод."],"head":["Тело","m, г","V, см³","ρ, г/см³","ρ, кг/м³","Вещество"],"rows":[["1","540","200","","",""],["2","78","10","","",""],["3","90","100","","",""]],"frame":"«Плотность вещества не зависит от …, потому что …»"},"keyB":"Тело 1: 2,7 г/см³ = 2700 кг/м³ – алюминий; тело 2: 7,8 г/см³ = 7800 кг/м³ – сталь (железо); тело 3: 0,9 г/см³ = 900 кг/м³ – лёд (или масло).","ex":null,"tasks":[{"q":"Масса тела 200 г, объём 25 см³. Найдите плотность в г/см³ и кг/м³.","hint":"","sol":"ρ = 200 : 25 = 8 г/см³ = 8000 кг/м³","a":"8000 кг/м³"},{"q":"Плотность льда 900 кг/м³. Найдите массу льда объёмом 2 м³.","hint":"","sol":"m = ρV = 900 · 2 = 1800 кг","a":"1800 кг"},{"q":"Масса керосина в бидоне 16 кг, плотность керосина 800 кг/м³. Найдите объём керосина в м³ и литрах.","hint":"","sol":"V = m : ρ = 16 : 800 = 0,02 м³ = 20 л","a":"0,02 м³ = 20 л"}],"ch":null,"real":"Строительство (выбор материалов по плотности), судостроение и авиация (лёгкие сплавы), ювелирное дело (проверка подлинности металла).","hw":"повторить §9–10; уровень 1 – разобрать ошибки в СОР по образцу; уровень 2 – исправить все ошибки; уровень 3 – составить две задачи на расчёт плотности и массы.","ansProb":"тела одинакового объёма имеют разную массу, потому что у веществ разная плотность – масса единицы объёма.","concl":"плотность – масса единицы объёма вещества; она зависит от вещества, а не от размеров тела","peer":"check","meth":["Обучение в сотрудничестве","Обучение в игровой форме"],"sim":"density","crit":[{"t":"Объясняет и формулирует (понимание темы)","d":["объясняет физический смысл плотности;","записывает формулы ρ = m : V, m = ρV, V = m : ρ;","переводит г/см³ в кг/м³."]},{"t":"Применяет знания при решении задач","d":["задание 1: выполняет по образцу, получает верный ответ (8000 кг/м³);","задание 2: выбирает верный способ решения (формулу), при необходимости переводит единицы;","задание 2: получает верный ответ (1800 кг);","задание 3: выбирает верный способ решения;","задание 3: получает верный ответ (0,02 м³ = 20 л)."]},{"t":"Работает в группе и делает вывод","d":["выполняет свою роль в группе;","фиксирует результат группы в листе задания;","делает вывод: плотность – масса единицы объёма вещества; она зависит от вещества, а не от размеров тела"]}]},{"n":11,"q":2,"sec":"Плотность (3 ч)","topic":"Лабораторная работа №3 «Определение плотности жидкостей и твёрдых тел»","kind":"lab", а нити, брусок.","safety":"стекло держать у стола, жидкости не пробовать, пролитое сразу вытереть, гири брать пинцетом.","steps":["Определите цену деления весов и мензурки.","Измерьте массу и объём жидкости, вычислите плотность.","Измерьте массу и объём камня, вычислите плотность.","Сравните результаты с таблицей, найдите вещество.","Запишите вывод."],"head":["Тело / жидкость","m, г","V, см³","ρ = m : V, г/см³","ρ, кг/м³"],"rows":[["Вода","","","",""],["Солевой раствор","","","",""],["Камень","","","",""]],"frame":"«Значение плотности отличается от табличного, потому что …»"},"keyB":"Плотность воды ≈ 1000 кг/м³, раствора больше (≈ 1100 кг/м³); отличие от табличных значений вызвано погрешностью приборов и неточным считыванием показаний.","ex":{"q":"Масса мензурки с жидкостью 140 г, пустой мензурки 90 г, объём жидкости 50 см³. Найдите плотность.","sol":"m = 140 − 90 = 50 г; ρ = 50 : 50 = 1 г/см³ = 1000 кг/м³.","a":"1000 кг/м³"},"tasks":[{"q":"Масса бруска 156 г, объём 20 см³. Найдите плотность и определите вещество по таблице.","hint":"Заготовка: ρ = m : V = ___ : ___ = ___ г/см³.","sol":"ρ = 156 : 20 = 7,8 г/см³ = 7800 кг/м³ – сталь","a":"7800 кг/м³, сталь"},{"q":"Мензурка с маслом 128 г, пустая 50 г, объём масла 85 см³. Найдите плотность масла в кг/м³.","hint":"Подсказка: m = m₂ − m₁.","sol":"m = 78 г; ρ = 78 : 85 ≈ 0,92 г/см³ ≈ 920 кг/м³","a":"≈ 920 кг/м³"},{"q":"Измеренная плотность воды 1020 кг/м³, табличная 1000 кг/м³. Найдите отклонение в процентах и назовите две причины.","hint":"","sol":"(1020 − 1000) : 1000 · 100 % = 2 %; причины: погрешность весов и мензурки, неточное считывание","a":"2 %"}],"ch":{"q":"Как определить плотность жидкости, имея только линейку, брусок известной плотности и ёмкость? Предложите способ.","ans":"например, по глубине погружения плавающего бруска: плотность жидкости определяют из условия плавания."},"real":"Контроль качества молока и топлива (ареометр), геология (определение минералов), ювелирное дело.","hw":"оформить отчёт; уровень и по закону Гука F = kΔl и экспериментально найдёт жёсткость пружины, соблюдая технику безопасности","hook":"Сжимает и отпускает резиновый мячик и пружину, а затем – комок пластилина: пружина и мяч восстанавливают форму, пластилин – нет.","problem":"Как связаны сила, растягивающая пружину, и её удлинение?","d":["что такое сила","как измеряют силу динамометром","что такое удлинение"],"model":["Показывает различие деформаций: «Упругая деформация исчезает после прекращения действия силы (пружина, мяч); пластическая – остаётся (пластилин, глина)».","Показывает закон Гука: «F упр = kΔl, где k – жёсткость (Н/м), Δl – удлинение. Если груз 2 Н растягивает пружину на 4 см, то k = 2 : 0,04 = 50 Н/м; при Δl = 6 см сила упругости F = 50 · 0,06 = 3 Н»."],"kw":"«деформация», «сила упругости», «закон Гука», «жёсткость»","grpT":["Выдаёт лист работы и оборудование: штатив, пружина, набор грузов по 100 г, линейка.","Просит измерить удлинение пружины для 1–4 грузов, вычислить силу упругости и жёсткость."],"grpS":["Подвешивают грузы, измеряют удлинение Δl, вычисляют F = mg и k = F : Δl.","Строят график зависимости F(Δl), проверяют, что он прямая через начало координат, находят среднее k."],"A":["1. Деформация, которая исчезает после прекращения действия силы, называется ____ , а которая остаётся – ____ .","2. Закон Гука: сила упругости F = ____ , где k – ____ , Δl – ____ .","3. Единица жёсткости в СИ – ____ .","4. Сила упругости направлена ____ деформации тела."],"Akey":["1. упругой; пластической.","2. kΔl; жёсткость; удлинение.","3. Н/м.","4. противоположно."],"B":{"title":"Лабораторная работа №4 «Изучение упругих деформаций»","equip":"штатив с пружиной, набор грузов по 100 г, линейка.","safety":"грузы не сбрасывать, пружину не растягивать за предел, оборудование держать вдали от края стола.","steps":["Закрепите пружину и измерьте начальную длину.","Подвешивайте грузы по одному и измеряйте удлинение Δl.","Вычислите F = mg и k = F : Δl.","Найдите среднее значение k.","Сделайте вывод."],"head":["m, г","F, Н","Δl, м","k = F : Δl, Н/м"],"rows":[["100","1","",""],["200","2","",""],["300","3","",""],["400","4","",""]],"frame":"«Сила упругости прямо пропорциональна …, поэтому k …»"},"keyB":"Отношение F : Δl примерно постоянно (жёсткость пружины), график F(Δl) – прямая через начало координат; закон Гука подтверждён в пределах упругой деформации.","ex":{"q":"Пружина жёсткостью 100 Н/м растянута на 5 см. Найдите силу упругости.","sol":"F = kΔl = 100 · 0,05 = 5 Н.","a":"5 Н"},"tasks":[{"q":"Груз 3 Н растягивает пружину на 6 см. Найдите жёсткость пружины.","hint":"Заготовка: k = F : Δl = ___ : ___ = ___ Н/м.","sol":"k = 3 : 0,06 = 50 Н/м","a":"50 Н/м"},{"q":"Жёсткость пружины 200 Н/м. Какую силу нужно приложить, чтобы растянуть её на 2 см? На сколько растянется пружина под силой 10 Н?","hint":"Подсказка: F = kΔl; Δl = F : k.","sol":"F = 200 · 0,02 = 4 Н; Δl = 10 : 200 = 0,05 м = 5 см","a":"4 Н; 5 см"},{"q":"Одну пружину растягивают двумя разными силами: 4 Н – удлинение 2 см, 10 Н – удлинение 5 см. Проверьте, выполняется ли закон Гука, и найдите k.","hint":"","sol":"k₁ = 4 : 0,02 = 200 Н/м; k₂ = 10 : 0,05 = 200 Н/м; значения совпадают – закон выполняется, k = 200 Н/м","a":"200 Н/м"}],"ch":{"q":"Почему закон Гука перестаёт выполняться при очень большой нагрузке?","ans":"после предела упругости деформация становится пластической: пружина не восстанавливает форму."},"real":"Динамометры и пружинные весы, амортизаторы автомобилей, матрасы и батуты, часовые пружины.","hw":"оформить отчёт; уровень 1 – решить две задачи на F = kΔl; уровень 2 – найти k по таблице; уровень 3 – построить график F(Δl) по своим данным и найти k.","ansProb":"сила упругости прямо пропорциональна удлинению пружины: F = kΔl.","concl":"сила упругости пропорциональна удлинению; жёсткость пружины – постоянная величина (k = F : Δl)","peer":"check","meth":["Лабораторный метод обучения","Обучение в сотрудничестве"],"sim":"hookes-law","crit":[{"t":"Объясняет и формулирует (понимание темы)","d":["ра ."],"kw":"«график F(Δl)», «жёсткость», «сила трения», «смазка»","grpT":["Выдаёт графики F(Δl) двух пружин и карточки «Трение в технике: полезное или вредное?».","Просит найти k по графикам, сравнить жёсткость и привести способы увеличить и уменьшить трение."],"grpS":["Находят k = F : Δl по точке на графике, определяют более жёсткую пружину.","Классифицируют примеры трения в технике на полезные и вредные, предлагают способы изменения трения."],"A":["1. График F(Δl) для закона Гука – ____ , проходящая через ____ .","2. Жёсткость по графику k = ____ : ____ для любой точки прямой.","3. Чем ____ график, тем больше жёсткость пружины.","4. Сила трения направлена ____ движения; трение уменьшают с помощью ____ ."],"Akey":["1. прямая; начало координат.","2. F; Δl.","3. круче.","4. против; смазки (подшипников)."],"B":{"title":"Жёсткость по графику и трение в технике","steps":["По графикам найдите точку на прямой и считайте F и Δl.","Вычислите k и сравните жёсткость пружин.","Для каждого примера определите, полезно ли трение.","Предложите способ изменения трения."],"head":["Пружина","F, Н","Δl, м","k, Н/м"],"rows":[["1","2","0,04",""],["2","6","0,03",""]],"frame":"«Пружина … жёстче, потому что при одинаковой силе её удлинение …»"},"keyB":"k₁ = 2 : 0,04 = 50 Н/м; k₂ = 6 : 0,03 = 200 Н/м; пружина 2 жёстче: её график круче.","ex":null,"tasks":[{"q":"По графику F(Δl) известна точка (5 см; 10 Н). Найдите жёсткость пружины.","hint":"","sol":"k = 10 : 0,05 = 200 Н/м","a":"200 Н/м"},{"q":"Жёсткость пружины 80 Н/м. Найдите удлинение при силе 4 Н и сделайте вывод о точке (Δl; F) на графике.","hint":"","sol":"Δl = 4 : 80 = 0,05 м = 5 см; точка (5 см; 4 Н) лежит на прямой через начало координат","a":"5 см"},{"q":"Приведите по два примера полезного и вредного трения в технике и предложите способ изменения трения в каждом случае.","hint":"","sol":"полезное: тормоза, шины (увеличивают рифлением); вредное: трение в подшипниках, в двигателе (смазка, подшипники)","a":"примеры и способы"}],"ch":null,"real":"Автомобильная техника (тормоза и шины), машиностроение (подшипники и смазка), спорт (шиповки, мази для лыж).","hw":"повторить §12–15; уровень 1 – разобрать ошибки в СОР по образцу; уровень 2 – исправить все ошибки; уровень 3 – составить две задачи на жёсткость по графику.","ansProb":"трение увеличивают там, где нужно сцепление (шины), и уменьшают там, где оно мешает (подшипники); жёсткость находят по графику как k = F : Δl.","concl":"жёсткость пружины находят по графику как k = F : Δl; трение полезно и вредно в зависимости от ситуации","peer":"stars","meth":["Обучение в сотрудничестве","Обучение в игровой форме"],"sim":"hookes-law","crit":[{"t":"Объясняет и формулирует (понимание темы)","d":["определяет жёсткость по графику F(Δl);","различает полезное и вредное трение;","называет способы увеличения и уменьшения трения."]},{"t":"Применяет знания при решении задач","d":["задание 1: выполняет по образцу, получает верный ответ (200 Н/м);","задание 2: выбирает верный способ решения (формулу), при необходимости переводит единицы;","задание 2: получает верный ответ (5 см);","задание 3: выбирает верный способ решения;","задание 3: получает верный ответ (примеры и способы)."]},{"t":"Работает в группе и делает вывод","d":["выполняет свою роль в группе;","фиксирует результат группы в листе задания;","делает вывод: жёсткость пружины находят по графику как k = F : Δl; трение полезно и вредно в зависимости от ситуации"]}]},{"n":16,"q":2,"sec":"Взаимодействие тел (5 ч)","topic":"Лабораторная работа №5 «Исследование силы трения скольжения»","kind":"lab","sn":0,"times":[3,5,6,21,6,4],"goals":[["7.2.2.6","описывать трение при скольжении, качении, покое"],["7.2.2.7","приводить примеры полезного и вредного проявления силы трения"],["7.2.2.8","изображать силы графически в заданном масштабе"],["7.2.2.9","графически находить равнодействующую сил, действующих на тело и направленных вдоль одной прямой"]],"smart":"опытным путём исследует силу трения скольжения, опишет трение скольжения, качения и покоя, изобразит силы в масштабе и найдёт их равнодействующую","hook":"Тянет брусок динамометром по столу и просит предсказать, что изменится, если положить на брусок груз или подложить карандаши (катки).","problem":"От чего зависит сила трения скольжения и как её уменьшить?","d":["как измеряют силу динамометром","как изображают силу","что такое равнодействующая"],"model":["Показывает измерение: «Равномерно тяну брусок по столу, динамометр показывает силу трения скольжения F тр; при равномерном движении сила тяги равна силе трения. F тр = 1,2 Н». Называет виды трения: покоя (самая большая до начала движения), скольжения, качения (обычно меньше).","Показывает построение: при масштабе 1 см – 0,5 Н сила 1,2 Н изображается стрелкой 2,4 см против движения; равнодействующая силы тяги 1,5 Н и силы трения 1,2 Н равна 0,3 Н по ходу движения."],"kw":"«сила трения», «трение скольжения, качения, покоя», «масштаб», «равнодействующая»","grpT":["Выдаёт лист работы и оборудование: динамометр, брусок, грузы, набор поверхностей (стол, ткань, наждачная бумага), карандаши-катки.","Просит измерить силу трения скольжения при разных нагрузках и поверхностях, сравнить со скольжением и качением."],"grpS":["Равномерно перемещают брусок по поверхностям, измеряют F тр, заполняют таблицу.","Изображают силы трения и тяги в масштабе и находят равнодействующую; сравнивают трение скольжения и качения."],"A":["1. Различают трение ____ , ____ и ____ .","2. Сила трения скольжения тем больше, чем ____ сила давления и чем ____ поверхность.","3. Трение качения обычно ____ трения скольжения.","4. При равномерном движении бруска сила тяги ____ силе трения."],"Akey":["1. покоя; скольжения; качения.","2. больше; шероховатее.","3. меньше.","4. равна."],"B":{"title":"Лабораторная работа №5 «Исследование силы трения скольжения»","equip":"динамометр, брусок, набор грузов, поверхности (стол, ткань, наждачная бумага), карандаши.","safety":"не тянуть брусок рывком, груз удерживать от падения, оборудование не выносить на край стола.","steps":["Измерьте вес бруска.","Равномерно тяните брусок по столу и считайте F тр.","Положите груз и повторите; смените поверхность и повторите.","Подложите карандаши и измерьте силу качения.","Изобразите силы в масштабе и сделайте вывод."],"head":["Условия опыта","Нагрузка, Н","F тр, Н"],"rows":[["Стол, без груза","",""],["Стол, с грузом","",""],["Наждачная бумага","",""],["Карандаши (качение)","",""]],"frame":"«Сила трения скольжения зависит от …, а трение качения …»"},"keyB":"Сила трения скольжения растёт с увеличением силы давления и шероховатости; трение качения меньше трения скольжения.","ex":{"q":"Силу тяги 2 Н и силу трения 1,5 Н, направленную противоположно, изобразите в масштабе 1 см – 0,5 Н и найдите равнодействующую.","sol":"стрелки 4 см и 3 см; R = 2 − 1,5 = 0,5 Н по ходу движения.","a":"0,5 Н"},"tasks":[{"q":"Динамометр при равномерном движении бруска показывает 2,4 Н. Чему равна сила трения? Изобразите её в масштабе 1 см – 0,8 Н.","hint":"Подсказка: при равномерном движении F тяги = F тр.","sol":"F тр = 2,4 Н; стрелка 3 см против движения","a":"2,4 Н; 3 см"},{"q":"Груз на бруске увеличил силу давления вдвое. Как изменилась сила трения скольжения? Приведите причину.","hint":"Образец: «Сила трения … , потому что сила давления …».","sol":"увеличилась примерно вдвое, так как трение скольжения растёт с увеличением силы давления","a":"увеличилась вдвое"},{"q":"На тело вправо действуют силы 8 Н и 3 Н, влево – 5 Н. Найдите равнодействующую и изобразите силы в масштабе 1 см – 2 Н.","hint":"","sol":"вправо 8 + 3 = 11 Н; R = 11 − 5 = 6 Н вправо; стрелки 4 см, 1,5 см, 2,5 см","a":"6 Н вправо"}],"ch":{"q":"Почему на льду легче передвигать груз, подложив катки, чем волоча его?","ans":"трение качения намного меньше трения скольжения."},"real":"Автомобильные шины и тормоза, подшипники (замена скольжения качением), лыжный спорт, дорожная безопасность на льду.","hw":"оформить отчёт; уровень 1 – записать результаты и вывод; уровень ку остриём и не входит шляпкой, хотя сила нажатия одинакова.","problem":"Почему одна и та же сила в одном случае оставляет заметный след, а в другом – почти нет?","d":["какая сила действует на тело на столе","как найти площадь прямоугольника","в каких единицах измеряют силу"],"model":["Сравнивает состояния вещества: «В твёрдых телах молекулы расположены близко, колеблются около положений равновесия; в жидкостях близко, но перемещаются; в газах далеко друг от друга и движутся свободно».","Вводит давление: «p = F : S, где F – сила, действующая перпендикулярно поверхности, S – площадь. Единица – паскаль: 1 Па = 1 Н/м². Пример: брусок весом 20 Н с площадью опоры 0,01 м²: p = 20 : 0,01 = 2000 Па. Чтобы уменьшить давление, увеличивают площадь (лыжи); чтобы увеличить – уменьшают (нож)»."],"kw":"«молекула», «давление», «площадь опоры», «паскаль»","grpT":["Раздаёт карточки «Состояния вещества» и задания: сравнить давление бруска на пластилин при разных гранях.","Просит измерить размеры граней, вычислить площадь и давление, сравнить с глубиной следа."],"grpS":["Сопоставляют карточки с состояниями вещества и описывают расположение и движение молекул.","Измеряют вес бруска и площади граней, вычисляют p = F : S и сравнивают результаты с глубиной следа на пластилине."],"A":["1. В ____ молекулы расположены далеко друг от друга и движутся свободно.","2. Давление p = ____ , где F – сила, действующая ____ поверхности, S – ____ .","3. Единица давления в СИ – ____ ; 1 Па = 1 ____ .","4. Чтобы уменьшить давление, нужно ____ площадь опоры или ____ силу."],"Akey":["1. газах.","2. F : S; перпендикулярно; площадь опоры.","3. паскаль (Па); Н/м².","4. увеличить; уменьшить."],"B":{"title":"Давление бруска на опору","steps":["Измерьте вес бруска динамометром.","Измерьте размеры граней и вычислите площади.","Вычислите давление для каждой грани p = F : S.","Сравните результат с глубиной следа на пластилине."],"head":["Грань","F, Н","S, м²","p = F : S, Па","Глубина следа"],"rows":[["Большая","","","",""],["Средняя","","","",""],["Малая","","","",""]],"frame":"«Давление больше на грани с … площадью, потому что …»"},"keyB":"Давление наибольшее на грани с наименьшей площадью (сила одна и та же); глубина следа больше там, где давление больше.","ex":{"q":"Сила 200 Н действует на площадь 0,5 м². Найдите давление.","sol":"p = F : S = 200 : 0,5 = 400 Па.","a":"400 Па"},"tasks":[{"q":"Вес ящика 600 Н, площадь опоры 0,3 м². Найдите давление ящика на пол.","hint":"Заготовка: p = F : S = ___ : ___ = ___ Па.","sol":"p = 600 : 0,3 = 2000 Па","a":"2000 Па"},{"q":"Масса мальчика 45 кг, площадь подошвы одного ботинка 150 см². Найдите давление при стоянии на двух ногах (g = 10 Н/кг).","hint":"Подсказка: F = mg; 150 см² = 0,015 м²; площадь двух ботинок – вдвое больше.","sol":"F = 450 Н; S = 0,03 м²; p = 450 : 0,03 = 15 000 Па = 15 кПа","a":"15 кПа"},{"q":"Танк массой 40 т стоит на гусеницах общей площадью 5 м². Найдите давление и объясните, почему оно меньше давления человека на ногах.","hint":"","sol":"F = 400 000 Н; p = 400 000 : 5 = 80 000 Па = 80 кПа; у танка большая площадь опоры","a":"80 кПа"}],"ch":{"q":"Во сколько раз увеличится давление, если площадь опоры уменьшить в 4 раза, а силу увеличить в 2 раза?","ans":"в 8 раз."},"real":"Лыжи и снегоступы (большая площадь), ножи и иглы (малая площадь), гусеничные машины, фундаменты зданий.","hw":"параграф учебника + задача: уровень 1 – найти давление по F и S; уровень 2 – с переводом единиц; уровень 3 – ещё и объяснить пример из быта.","ansProb":"результат зависит не только от силы, но и от площади, на которую она действует: давление p = F : S.","concl":"давление равно отношению силы к площади; его меняют изменением площади опоры","peer":"stars","meth":["Обучение в сотрудничестве","Лабораторный метод обучения"],"sim":"states-of-matter","crit":[{"t":"Объясняет и формулирует (понимание темы)","d":["описывает строение газов, жидкостей и твёрдых тел;","объясняет физический смысл давления и способы его изменения;","применяет формул я вода), наблюдают изменение поведения тела."],"A":["1. Если F А ____ F т, тело тонет; если F А ____ F т – тело всплывает.","2. Тело плавает внутри жидкости, если ρ тела ____ ρ жидкости.","3. Тело всплывает, если плотность тела ____ плотности жидкости.","4. Выталкивающая сила возникает из-за разности ____ на верхнюю и нижнюю грани тела."],"Akey":["1. меньше; больше.","2. равна.","3. меньше.","4. давлений."],"B":{"title":"Лабораторная работа №7 «Определение условия плавания тел»","equip":"тела из разных материалов, весы, мензурка, стакан с водой, солевой раствор, динамометр.","safety":"жидкости не пробовать, пролитое сразу вытирать, стекло держать у стола.","steps":["Измерьте массу и объём каждого тела, вычислите F т = mg.","Вычислите F А = ρ ж gV при полном погружении.","Предскажите поведение тела и проверьте опытом в воде и в солевом растворе.","Сравните предсказание с наблюдением."],"head":["Тело","F т, Н","F А, Н","Предсказание","Результат опыта"],"rows":[["1","","","",""],["2","","","",""],["3","","","",""]],"frame":"«Тело плавает, потому что …, а тонет, когда …»"},"keyB":"Тело тонет при F А < F т (ρ тела > ρ ж), плавает при F А = F т, всплывает при F А > F т; в солёной воде большая плотность жидкости увеличивает F А.","ex":{"q":"Тело массой 0,3 кг и объёмом 400 см³. Утонет ли оно в воде?","sol":"F т = 3 Н; F А = 1000 · 10 · 4·10⁻⁴ = 4 Н; F А > F т – всплывёт.","a":"всплывёт"},"tasks":[{"q":"Плотность тела 2700 кг/м³. Утонет ли оно в воде?","hint":"Подсказка: сравните ρ тела и ρ воды.","sol":"2700 > 1000 – утонет","a":"утонет"},{"q":"Масса бруска 2 кг, объём 0,004 м³. Найдите F т и F А при полном погружении в воду. Что произойдёт с бруском?","hint":"Заготовка: F т = mg = ___ Н; F А = ρgV = ___ Н.","sol":"F т = 20 Н; F А = 1000 · 10 · 0,004 = 40 Н; F А > F т – всплывёт","a":"всплывёт"},{"q":"Айсберг плавает в океане; плотность льда 900 кг/м³, воды 1030 кг/м³. Найдите, какая часть айсберга находится под водой.","hint":"","sol":"ρ льда : ρ воды = 900 : 1030 ≈ 0,87 ___ из одного вида в другой.","2. Полная механическая энергия E = ____ + ____ .","3. При падении тела E п ____ , а E к ____ .","4. При отсутствии трения полная механическая энергия ____ ."],"Akey":["1. переходит.","2. E к; E п.","3. уменьшается; увеличивается.","4. сохраняется."],"B":{"title":"Превращение энергии при падении тела","steps":["Для тела массой 2 кг, падающего с высоты 5 м, вычислите E п на каждой высоте.","Вычислите E к из закона сохранения: E к = E − E п.","Проверьте E = E к + E п.","Найдите скорость в каждой точке."],"head":["h, м","E п = mgh, Дж","E к, Дж","E, Дж"],"rows":[["5","","",""],["3","","",""],["1","","",""],["0","","",""]],"frame":"«При падении E п … , E к … , а сумма …»"},"keyB":"h = 5: E п = 100, E к = 0; h = 3: 60 и 40; h = 1: 20 и 80; h = 0: 0 и 100. Сумма постоянна – 100 Дж.","ex":{"q":"Камень падает с высоты 20 м. С какой скоростью он достигнет земли? Сопротивлением пренебречь.","sol":"v = √(2gh) = √(2 · 10 · 20) = 20 м/с.","a":"20 м/с"},"tasks":[{"q":"Приведите три примера превращения энергии из одного вида в другой.","hint":"Образец: «Падающий камень: E п → E к».","sol":"качели: E п ↔ E к; плотина: E п воды → E к → электричество; лук: E упр → E к стрелы","a":"три примера"},{"q":"Мяч брошен вверх со скоростью 10 м/с. На какую высоту он поднимется?","hint":"Подсказка: mv² : 2 = mgh.","sol":"h = v² : (2g) = 100 : 20 = 5 м","a":"5 м"},{"q":"Тело массой 1 кг падает с высоты 10 м. Найдите E к на высоте 4 м от земли и скорость в этой точке.","hint":"","sol":"E = mgh = 100 Дж; E п на 4 м = 40 Дж; E к = 60 Дж; v = √(2 · 60 : 1) ≈ 11 м/с","a":"60 Дж; ≈ 11 м/с"}],"ch":{"q":"Почему реальный маятник со временем останавливается, хотя закон сохранения энергии выполняется?","ans":"из-за трения и сопротивления воздуха механическая энергия переходит во внутреннюю (тело и воздух нагреваются)."},"real":"ГЭС и ветряные станции, американские горки, прыжки с шестом, рекуперация в электромобилях.","hw":"параграф учебника + задачи: уровень 1 – привести 3 пр
