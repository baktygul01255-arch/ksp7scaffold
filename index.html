нь Солнце не заходит за горизонт?","ans":"из-за наклона оси полушарие высоко приподнято к Солнцу, и в высоких широтах оно не опускается за горизонт."},"real":"Календарь и сельское хозяйство, навигация по звёздам, космические исследования, прогноз погоды.","hw":"параграф учебника + задания: уровень 1 – выписать планеты; уровень 2 – сравнить две планеты; уровень 3 – объяснить смену времён года рисунком.","ansProb":"времена года меняются из-за наклона оси Земли при её обращении вокруг Солнца, а смена дня и ночи – из-за вращения вокруг оси.","concl":"Земля вращается вокруг оси (день и ночь) и обращается вокруг Солнца (год); наклон оси даёт смену времён года","peer":"pmi","meth":["Обучение в сотрудничестве","Обучение в игровой форме"],"sim":"my-solar-system","crit":[{"t":"Объясняет и формулирует (понимание темы)","d":["сравнивает геоцентрическую и гелиоцентрическую системы;","систематизирует объекты Солнечной системы;","объясняет смену времён года и длительность дня."]},{"t":"Применяет знания при решении задач","d":["задание 1: выполняет по образцу, получает верный ответ (8 планет);","задание 2: выбирает верный способ решения (формулу), при необходимости переводит единицы;","задание 2: получает верный ответ (наклон оси);","задание 3: выбирает верный способ решения;","задание 3: получает верный ответ (365,25; 29,5)."]},{"t":"Работает в группе и делает вывод","d":["выполняет свою роль в группе;","фиксирует результат группы в листе задания;","делает вывод: Земля вращается вокруг оси (день и ночь) и обращается вокруг Солнца (год); наклон оси даёт смену времён года"]}]}]},"kk":{"meta":{"goalPre":"Сабақ соңында (45 минут ішінде) әрбір оқушы ","goalPost":", өзі таңдаған деңгейдегі кеңестерді пайдаланады.","s1":["Сыныппен амандасады, дайындығын тексереді. Сыныпты 4 адамнан топтарға бөледі (түрлі-түсті карточкалар). Рөл карточкаларын таратады: баяндамашы, тәжірибе жүргізуші, рәсімдеуші, қауіпсіздік техникасын бақылаушы.","Топтарда орындарын алады, рөлдерді бөліседі, оқу құралдарының барын тексереді."],"levels":"Жоғары деңгей: 9–11 балл; орта: 6–8 балл; төмен: 0–5 балл.","tools":[["«Екі жұлдыз және бір тілек»","Көрші топ жұмысының екі күшті жағы және нені жақсартуға болатыны туралы бір ұсыныс."],["«Плюс – минус – қызықты»","Не жақсы шықты; нені жақсартуға болады; не қызықты болды."],["Стикердегі өзін-өзі талдау",["1. Менің не істей алғаным?","2. Нені қиын көрдім?","3. Маған қандай кеңес көмектесті?","4. Нені жетілдіруім керек?"]],["«Бағдаршам»","Жасыл – тақырыпты түсіндім; сары – ішінара түсіндім; қызыл – көмек керек. Сабақтың басында және соңында көрсетіледі."]],"teacher":"Байсельдинова Б.Б.","cls":"7 «А»","org":"«Музыкалық колледж – дарынды балаларға арналған музыкалық мектеп-интернат» кешені» ММ"},"lessons":[{"n":1,"q":1,"sec":"Физика – табиғат туралы ғылым (1 сағ)","topic":"Физика – табиғат туралы ғылым. Табиғатты зерттеудің ғылыми әдістері","kind":"std","sn":0,"times":[3,7,9,11,12,3],"goals":[["7.1.1.1","Физикалық құбылыстарға мысалдар келтіру"],["7.1.1.2","табиғатты зерттеудің ғылыми әдістерін ажырату"]],"smart":"физикалық құбылыстардың кемінде үш мысалын келтіреді, бақылау мен тәжірибені (эксперимент) табиғатты зерттеу әдістері ретінде ажыратады және үш жағдайдағы сипаттама бойынша әдісті анықтайды","hook":"Үш шағын тәжірибе көрсетеді: жиырылған және жазылған қағаз парағының түсуі, жүнге үйкелген пластик сызғыштың қағаз кесектерін тартуы, стақандағы судың қызуы.","problem":"Адамдар табиғат заңдарын қалай біледі: тек бақылау арқылы ма, әлде басқаша ма?","d":["табиғат құбылысының мысалын келтіріңіз","бақылау дегеніміз не","тәжірибе бақылаудан немен ерекшеленеді"],"model":["Шағын тәжірибелер бойынша дауыстап ой жүргізеді: «Қағаздың түсуі – механикалық құбылыс; сызғыш қағаздарды тартады – электрлік құбылыс; су қызады – жылулық құбылыс».","Танымдық жолды сызбада көрсетеді: бақылау → болжам → тәжірибе (эксперимент) → қорытынды → теория (модель) және әр жағдайда қандай әдіс қолданылғанын атайды."],"kw":"«физикалық құбылыс», «бақылау», «тәжірибе (эксперимент)», «гипотеза (болжам)»","grpT":["Он жағдайы бар карточкалар (найзағай, судың қызуы, алманың түсуі, кемпірқосақ, қоңырау үні және т.б.) және «Жіктеу» парағын таратады: құбылыс түрін және оны зерттеу әдісін анықтау.","«Дененің пішіні оның түсуіне әсер етеді» болжамын тексеруді ұсынады: жиырылған және жазылған қағаз парағы."],"grpS":["Құбылыстарды жіктейді (механикалық, жылулық, электрлік, жарық, дыбыстық) және сипаттама бойынша таным әдісін анықтайды.","Шағын тәжірибе жүргізіп, болжамды, бақылауды және қорытындыны дайын үлгі бойынша жазады: «Біз ... деп болжадық; тәжірибе ... екенін көрсетті»."],"A":["1. Табиғатта болатын барлық нәрсе ____ деп аталады. Физика зерттейтін құбылыстар ____ құбылыстар деп аталады.","2. Физикалық құбылыс түрлері: ____ , жылулық, ____ , жарық, дыбыстық.","3. Табиғатты зерттеудің негізгі әдістері: ____ (құбылысқа араласпай зерттеу) және ____ (құбылыс берілген жағдайда қайта жасалады).","4. Ғылыми таным реті: бақылау → ____ → тәжірибе → ____ ."],"Akey":["1. табиғат құбылыстары; физикалық.","2. механикалық; электрлік.","3. бақылау; тәжірибе (эксперимент).","4. болжам; қорытынды."],"B":{"title":"Шағын тәжірибе «Дененің пішіні оның түсуіне әсер ете ме?»","equip":"екі бірдей қағаз парағы, секундомер.","safety":"заттарды сыныптастарға лақтырмау.","steps":["Болжамды жазыңыз: «Жиырылған парақ жазылған парақтан ... түседі».","Бір парақты жиырыңыз, екіншісін жазылған күйінде қалдырыңыз.","Парақтарды созылған қол биіктігінен бір мезгілде жіберіңіз (үш рет).","Қай парақтың бұрын түскенін жазыңыз.","Қорытынды жасаңыз."],"head":["Талпыныс","Қай парақ бұрын түсті","Бақылау қорытындысы"],"rows":[["1","",""],["2","",""],["3","",""]],"frame":"«Біз ... деп болжадық; тәжірибе ... екенін көрсетті; демек, дененің пішіні түсуге ... .»"},"keyB":"Жиырылған парақ тезірек түседі; дененің пішіні түсуге әсер етеді (ауа кедергісі). «Тәжірибе» әдісі қолданылды, болжам тексерілді.","ex":{"q":"Ғалым өзендегі судың қай күні қататынын көп күн бойы жазып отырады.","sol":"Әдіс – бақылау: құбылысқа араласпай зерттейді.","a":"бақылау"},"tasks":[{"q":"Әдісті анықтаңыз: оқушы терезе сыртындағы термометр бойынша екі тәулік бойы ауа температурасын жазады.","hint":"Кеңес: біз құбылысқа араласамыз ба? Үлгі: «Әдіс – ..., себебі ... ».","sol":"бақылау (біз араласпаймыз, тек жазамыз)","a":"бақылау"},{"q":"Оқушы стақандағы суды қыздырып, қыздырғыштың қуатын өзгертеді және әр минут сайын температураны өлшейді. Әдісті және құбылыс түрін атаңыз.","hint":"Кеңес: жағдайды өзіміз өзгертсек – бұл тәжірибе; қыздыру – жылулық құбылыс.","sol":"тәжірибе (эксперимент); жылулық құбылыс","a":"тәжірибе; жылулық"},{"q":"«Ауыр шар жеңіл шарға қарағанда тез түседі» болжамын тексеру жоспарын құрыңыз: нені өлшейсіз және нені бірдей қалдырасыз?","hint":"","sol":"Шарларды бір биіктіктен тастап, түсу уақытын өлшеу; биіктік пен шарлардың өлшемін бірдей қалдыру; қорытындыны нәтиже бойынша жасау.","a":"тәжірибе жоспары"}],"ch":{"q":"Тұрмыстан механикалық, жылулық, жарық және дыбыстық құбылыстардың әрқайсысына бір мысалдан келтіріңіз.","ans":"мысалы: доп домалайды; мұз ериді; кемпірқосақ; қоңырау соғылады."},"real":"Метеорология (бақылау бойынша болжам), медицина (клиникалық сынақтар – тәжірибе), техника (жаңа материалдарды тексеру).","hw":"оқулықтағы параграф + таңдау бойынша тапсырма: 1-деңгей – үйден 3 құбылыс мысалын келтіру; 2-деңгей – құбылыс түрін көрсетіп, 5 мысал келтіру; 3-деңгей – «болжам – тәжірибе – қорытынды» сызбасы бойынша бір үйдегі тәжірибені сипаттау.","ansProb":"табиғат заңдарын бақылау арқылы да, тәжірибе арқылы да біледі: бақылау фактілер мен болжам береді, тәжірибе оны тексереді, содан кейін қорытынды жасалады.","concl":"дененің пішіні түсуге әсер етеді; болжам тәжірибемен тексерілді","peer":"stars","meth":["Бірлесіп оқыту","Ойын түріндегі оқыту"],"sim":"","crit":[{"t":"Түсіндіреді және тұжырымдайды (тақырыпты түсіну)","d":["физикалық құбылыстардың кемінде үш мысалын келтіреді;","бақылау мен тәжірибені (эксперимент) ажыратады;","таным кезеңдерін атайды: бақылау, болжам, тәжірибе, қорытынды."]},{"t":"Есеп шығаруда білімін қолданады","d":["1-тапсырма: үлгі бойынша орындайды, дұрыс жауап алады (бақылау);","2-тапсырма: шешудің дұрыс жолын (формуланы) таңдайды, қажет болса бірліктерді ауыстырады;","2-тапсырма: дұрыс жауап алады (тәжірибе; жылулық);","3-тапсырма: шешудің дұрыс жолын таңдайды;","3-тапсырма: дұрыс жауап алады (тәжірибе жоспары)."]},{"t":"Топта жұмыс істеп, қорытынды жасайды","d":["топтағы өз рөлін орындайды;","топ нәтижесін тапсырма парағына тіркейді;","қорытынды жасайды: дененің пішіні түсуге әсер етеді; болжам тәжірибемен тексерілді"]}]},{"n":2,"q":1,"sec":"Физикалық шамалар мен өлшеулер (4 сағ)","topic":"Халықаралық бірліктер жүйесі (СИ). Скаляр және векторлық физикалық шамалар","kind":"std","sn":0,"times":[3,7,9,11,12,3],"goals":[["7.1.2.1","физикалық шамаларды олардың SI- жүйесіндегі өлшем бірліктерімен сәйкестендіру"],["7.1.2.2","скаляр және векторлық физикалық шамалар ажырату және мысалдар келтіру"]],"smart":"физикалық шамаларды СИ бірліктерімен сәйкестендіреді, скаляр және векторлық шамаларды ажыратады және әр түрден мысал келтіреді","hook":"Екі оқушыдан парта ұзындығын өз қадамдарымен өлшеуді сұрайды: нәтижелер әртүрлі шығады. Сантиметр және дюйм белгіленген сызғышты көрсетеді.","problem":"Өлшеу үшін неге бірыңғай бірліктер жүйесі қажет?","d":["ұзындық бірлігін атаңыз","физикалық шама дегеніміз не","бағыты бар шамаға мысал келтіріңіз"],"model":["Дауыстап ой жүргізеді: «Адамдардың қадамдары әртүрлі, сондықтан нәтижелер де әртүрлі; барлық елдер үшін Халықаралық бірліктер жүйесі (СИ) қабылданған: метр (м), килограмм (кг), секунд (с)» – және СИ негізгі бірліктерінің кестесін көрсетеді.","Скаляр мен векторды мысалдармен ажыратады: «Массасы 5 кг – сан жеткілікті, бұл скаляр; жылдамдығы 5 м/с оңға қарай – сан да, бағыт та қажет, бұл вектор»; векторды көрсеткімен бейнелейді."],"kw":"«СИ», «негізгі бірліктер», «скаляр», «вектор»","grpT":["Шамалар (масса, жол, орын ауыстыру, жылдамдық, уақыт таразыда өлшеуді көрсетеді: «Денені сол жақ табаққа, өлшеуіштерді оң жақ табаққа салып, теңестіремін; дененің массасы өлшеуіштер массасының қосындысына тең: m = 50 г + 10 г + 2 г = 62 г». Таразы түрлерін атайды: иіндікті, серіппелі, электрондық.","Көлемді өлшеуді көрсетеді: куб көлемі V = a³; тас үшін – судың ығысуы бойынша: V = V₂ − V₁ = 58 мл − 40 мл = 18 мл = 18 см³ (1 мл = 1 см³)."],"kw":"«масса», «таразы», «көлем», «мензурка», «судың ығысуы»","grpT":["Жиынтықтарды таратады: таразы, өлшеуіштер, суы бар мензурка, дұрыс (білеуше) және дұрыс емес (тас) пішінді денелер.","Әр дененің массасы мен көлемін өлшеп, нәтижелерді СИ бірліктерімен (кг, м³) жазуды сұрайды."],"grpS":["Денелерді таразыға өлшейді, білеушенің көлемін өлшемдері бойынша, тастың көлемін судың ығысуы бойынша өлшейді, кестені толтырады.","Бірліктерді аударады: г → кг, см³ → м³, нәтижені бір-бірінің жұмысынан тексереді."],"A":["1. Дененің массасы – дененің ____ өлшемі болатын физикалық шама; СИ-дегі масса бірлігі – ____ .","2. Иіндікті таразыда өлшегенде денені ____ табаққа, өлшеуіштерді ____ табаққа салады.","3. Дұрыс емес пішінді дененің көлемі V = V₂ − V₁, мұндағы V₁ – судың көлемі, V₂ – ____ бірге судың көлемі.","4. 1 мл = 1 ____ ; 1 м³ = ____ см³."],"Akey":["1. инерттілігінің; килограмм (кг).","2. сол жақ; оң жақ.","3. денемен.","4. см³; 1 000 000."],"B":{"title":"Денелердің массасы мен көлемін өлшеу","equip":"өлшеуіштері бар таразы, суы бар мензурка, білеуше, жіпке байланған тас.","safety":"шыны мензурканы үстел жанында ұстау, суды төкпеу, өлшеуіштерді тек пинцетпен алу.","steps":["Таразының (ең кіші өлшеуіш) және мензурканың бөлік құнын анықтаңыз.","Білеуше мен тасты өлшеңіз.","Білеушенің көлемін өлшемдері бойынша, тастың көлемін судың ығысуы бойынша табыңыз.","Нәтижелерді кестеге СИ бойынша жазыңыз."],"head":["Дене","Масса m, г","Көлем V, см³","m, кг","V, м³"],"rows":[["Білеуше","","","",""],["Тас","","","",""]],"frame":"«Дұрыс емес пішінді дененің көлемін табуға болады, себебі дене ... ығыстыра  және ауырлық күші. Салмақ","kind":"std","sn":0,"times":[3,7,9,11,12,3],"goals":[["7.2.2.10","масса, салмақ және ауырлық күші ұғымдарын ажырату"]],"smart":"ауырлық күші мен дене салмағын ажыратады, ауырлық күшін F = mg және салмақты есептейді, оларды түсу нүктелерін көрсетіп көрсеткілермен бейнелейді","hook":"Допты үстел үстінде жібереді және жіпке іледі: «Екі жағдайда да допқа Жер әсер етеді – бірақ бірінші және екінші жағдайда не болады?».","problem":"Дененің салмағы мен оған әсер ететін ауырлық күші бір нәрсе ме?","d":["масса дегеніміз не","күш қандай бірліктермен өлшенеді","күш дегеніміз не"],"model":["Ауырлық күшін енгізеді: «Барлық денелер Жерге тартылады – бұл тартылыс құбылысы; ауырлық күші F = mg, мұндағы g ≈ 10 Н/кг (дәлірек 9,8). m = 2 кг үшін: F = 2 · 10 = 20 Н; денеге түсірілген, төмен бағытталған».","Салмақты енгізеді: «Салмақ – дененің Жерге тартылуы салдарынан тірекке немесе аспаға әсер ету күші. Тірекке түсірілген, төмен бағытталған; көлденең тіректе тыныштықта P = mg, бірақ бұл басқа күш, себебі басқа денеге түсірілген»."],"kw":"«тартылыс», «ауырлық күші», «салмақ», «түсу нүктесі»","grpT":["Динамометрлерді, жүктерді және «Ауырлық күші ме, әлде салмақ па?» карточкаларын береді.","Жүктердің салмағын өлшеп, ауырлық күшін есептеп, салыстыруды және үстелдегі және аспадағы жүк үшін екі күшті бейнелеуді сұрайды."],"grpS":["Жүктің салмағын динамометрмен өлшейді, F = mg есептейді, мәндерді салыстырады.","Суретте ауырлық күшін (денеге) және салмақты (тірекке) бейнелейді және бұлардың неге әртүрлі күштер екенін түсіндіреді."],"A":["1. Жердің денені тартатын күші ____ деп аталады; F = ____ , мұндағы g ≈ ____ Н/кг.","2. Ауырлық күші ____ түсірілген, ____ бағытталған.","3. Салмақ – дененің ____ немесе ____ әсер ету күші.","4. Салмақ ____ түсірілген, ал ауырлық күші – ____ түсірілген."],"Akey":["1. ауырлық күші; mg; 10 (9,8).","2. денеге; төмен (Жер центріне).","3. тірекке; аспаға.","4. тірекке (аспаға); денеге."],"B":{"title":"Ауырлық күші және салмақ","steps":[ н анықтау тәсілін ұсыну.","ansProb":"сырғанау үйкеліс күші қысым күшіне және беттердің кедір-бұдырлығына тәуелді; оны майлаумен немесе сырғанауды домалаумен ауыстырумен азайтады.","concl":"сырғанау үйкеліс күші қысым күшімен және кедір-бұдырлықпен өседі; домалау үйкелісі сырғанау үйкелісінен аз","peer":"check","meth":["Зертханалық оқыту әдісі","Бірлесіп оқыту"],"sim":"friction","crit":[{"t":"Түсіндіреді және тұжырымдайды (тақырыпты түсіну)","d":["сырғанау, домалау және тыныштық үйкелісін сипаттайды;","пайдалы және зиянды үйкеліске мысал келтіреді;","күштерді масштабпен бейнелеп, тең әрекетті күшті табады."]},{"t":"Есеп шығаруда білімін қолданады","d":["1-тапсырма: үлгі бойынша орындайды, дұрыс жауап алады (2,4 Н; 3 см);","2-тапсырма: шешудің дұрыс жолын (формуланы) таңдайды, қажет болса бірліктерді ауыстырады;","2-тапсырма: дұрыс жауап алады (екі есе артты);","3-тапсырма: шешудің дұрыс жолын таңдайды;","3-тапсырма: дұрыс жауап алады (6 Н оңға)."]},{"t":"Өлшеулер жүргізіп, қорытынды жасайды","d":["құралдардың көрсеткіштерін өлшем бірліктерімен жазады;","өлшеу нәтижелері бойынша есептеулер орындайды;","қорытынды жасайды: сырғанау үйкеліс күші қысым күшімен және кедір-бұдырлықпен өседі; домалау үйкелісі сырғанау үйкелісінен аз"]}]},{"n":17,"q":3,"sec":"Қысым (8 сағ)","topic":"Газдардың, сұйықтар мен қатты денелердің молекулалық құрылымы. Қатты денелердегі қысым","kind":"std","sn":0,"times":[3,7,9,11,12,3],"goals":[["7.3.1.1","заттардың молекулалық құрылысы негізінде, газдардың сұйықтар мен қатты денелердің құрылымын сипаттау"],["7.3.1.2","қысымның физикалық мағынасын түсіндіру және өзгерту әдістерін сипаттау"],["7.3.1.3","есептер шығаруда қатты дененің қысымының формуласын қолдану"]],"smart":"газдардың, сұйықтардың және қатты денелердің құрылысын молекулалық көзқарас бойынша сипаттайды, қысымның физикалық мағынасын түсіндіреді және қатты дене қысымын p = F : S формуласымен есептейді","hook":"Кнопканың тақтайға үшкір жағымен оңай кіретінін, ал басымен кірмейтінін көрсетеді, ал басу күші бірдей.","problem":"Неге бірдей күш бір жағдайда байқалатын із қалдырады, ал екіншісінде дерлік қалдырмайды?","d":["үстелдегі денеге қандай күш әсер етеді","тіктөртбұрыш ауданын қалай табады","күш қандай бірліктермен өлшенеді"],"model":["Заттың күйлерін салыстырады: «Қатты денелерде молекулалар бір-біріне жақын, тепе-теңдік орны маңында тербеледі; сұйықтарда жақын, бірақ орын ауыстырады; газдарда бір-бірінен алыс және еркін қозғалады».","Қысымды енгізеді: «p = F : S, мұндағы F – бетке перпендикуляр әсер ететін күш, S – аудан. Бірлігі – паскаль: 1 Па = 1 Н/м². Мысал: салмағы 20 Н, тірек ауданы 0,01 м² білеуше: p = 20 : 0,01 = 2000 Па. Қысымды азайту үшін ауданды арттырады (шаңғы); арттыру үшін – азайтады (пышақ)»."],"kw":"«молекула», «қысым», «тірек ауданы», «паскаль»","grpT":["«Заттың күйлері» карточкаларын және тапсырмаларды таратады: білеушенің әртүрлі жағымен пластилинге түсіретін қысымын салыстыру.","Беттерінің өлшемдерін өлшеп, ауданын және қысымды есептеуді, із тереңдігімен салыстыруды сұрайды."],"grpS":["Карточкаларды заттың күйлерімен сәйкестендіріп, молекулалардың орналасуы мен қозғалысын сипаттайды.","Білеушенің салмағын және беттерінің ауданын өлшейді, p = F : S есептейді, нәтижелерді пластилиндегі із тереңдігімен салыстырады."],"A":["1. ____ молекулалар бір-бірінен алыс орналасқан және еркін қозғалады.","2. Қысым p = ____ , мұндағы F – бетке ____ әсер ететін күш, S – ____ .","3. СИ-дегі қысым бірлігі – ____ ; 1 Па = 1 ____ .","4. Қысымды азайту үшін тірек ауданын ____ немесе күшті ____ керек."],"Akey":["1. газдарда.","2. F : S; перпендикуляр; тірек ауданы.","3. паскаль (Па); Н/м².","4. арттыру; азайту."],"B":{"title":"Білеушенің тірекке түсіретін қысымы","steps":["Білеушенің салмағын динамометрмен өлшеңіз.","Беттерінің өлшемдерін өлшеп, аудандарын есептеңіз.","Әр бет үшін қысымды p = F : S есептеңіз.","Нәтижені пластилиндегі із тереңдігімен салыстырыңыз."],"head":["Бет","F, Н","S, м²","p = F : S, Па","Із тереңдігі"],"rows":[["Үлкен","", function pickItems(){const n=names();if(n.length)return n;const c=Math.max(1,+S.get('count',25)||25);return Array.from({length:c},(_,i)=>String(i+1))}
function toolPick(){const u=U();const sh=$('shTool');
  sh.innerHTML=sheetHead(u.pickT)+`<div class="body"><div class="seg" role="group"><button data-pm="one" aria-pressed="${pk.mode==='one'}">${esc(u.pickOne)}</button><button data-pm="grp" aria-pressed="${pk.mode==='grp'}">${esc(u.pickGrp)}</button></div>
  <div id="pkMain"></div>
  <div><label class="l" for="pkNames">${esc(u.names)}</label><textarea id="pkNames">${esc(S.get('names',''))}</textarea><p class="hint">${esc(u.namesH)}</p></div>
  <div><label class="l" for="pkCnt">${esc(u.cnt)}</label><input type="number" id="pkCnt" min="1" max="60" value="${esc(S.get('count',25))}"></div></div>`;pkMain()}
function pkMain(){const u=U(),m=$('pkMain');if(!m)return;
  if(pk.mode==='one'){const left=(pk.pool||pickItems()).length;
    m.innerHTML=`<div class="pick go" id="pkOut">?</div><div class="row" style="margin-top:10px"><button class="btn pri" id="pkGo" style="flex:1;min-height:56px;font-size:1.2rem">${esc(u.go)}</button><button class="btn" id="pkRst">${esc(u.reset)}</button></div>
    <label class="row" style="margin-top:8px"><input type="checkbox" id="pkNr" ${S.get('norep',true)?'checked':''} style="width:22px;height:22px;min-height:0"> ${esc(u.noRepeat)} · <span class="hint">${esc(u.left)}: <span id="pkLeft">${left}</span></span></label>`}
  else{m.innerHTML=`<label class="l" for="pkSz">${esc(u.gsize)}</label><input type="number" id="pkSz" min="2" max="8" value="${esc(S.get('gsize',4))}"><div class="row" style="margin:10px 0"><button class="btn pri" id="pkMk" style="flex:1;min-height:52px">${esc(u.make)}</button></div><div id="pkGr" style="display:grid;gap:8px"></div>`}}
function pkGo(){if(pk.busy)return;const items=pickItems();const nr=$('pkNr').checked;S.set('norep',nr);
  if(!pk.pool||!nr||pk.pool.some(x=>!items.includes(x))&&false)pk.pool=items.slice();
  if(!pk.pool.length)pk.pool=items.slice();
  const pool=nr?pk.pool:items;const fin=pool[Math.floor(Math.random()*pool.length)];const out=$('pkOut');out.classList.remove('go');pk.busy=true;let i=0,d=50;
  (function tick(){out.textContent=items[Math.floor(Math.random()*items.length)];i++;d*=1.14;if(d<420){setTimeout(tick,d)}else{out.textContent=fin;pk.busy=false;if(nr)pk.pool=pk.pool.filter(x=>x!==fin);$('pkLeft').textContent=nr?pk.pool.length:items.length}})()}
function pkGroups(){const items=pickItems();const sz=Math.max(2,+$('pkSz').value||4);S.set('gsize',sz);
  for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}
  const k=Math.max(1,Math.round(items.length/sz));const g=Array.from({length:k},()=>[]);items.forEach((x,i)=>g[i%k].push(x));
  const roles=U().roles;$('pkGr').innerHTML=g.map((a,i)=>`<div class="grp"><b>${esc(U().grp)} ${i+1}</b><div>${a.map((x,j)=>`<div>${esc(x)}${j<4?` <span class="hint">· ${esc(roles[j])}</span>`:''}</div>`).join('')}</div></div>`).join('')}
/* light */
const lt={g:0,y:0,r:0};
function toolLight(){const u=U();const tot=lt.g+lt.y+lt.r;
  $('shTool').innerHTML=sheetHead(u.lightT)+`<div class="body"><p class="hint">${esc(u.lightH)}</p>
  <div class="light">${['g','y','r'].map(c=>`<button class="lt ${c}" data-lt="${c}"><span>${lt[c]}<small>${esc(u[c])}</small></span></button>`).join('')}</div>
  <div class="row">${['g','y','r'].map(c=>`<button class="btn mini" data-ltm="${c}">− ${esc(u[c])}</button>`).join('')}</div>
  <div class="dist" aria-hidden="true">${['g','y','r'].map(c=>`<i style="width:${tot?100*lt[c]/tot:0}%;background:var(--${c})"></i>`).join('')}</div>
  <div class="row"><b>${esc(u.total)}: ${tot}</b><button class="btn mini" data-ltr style="margin-left:auto">${esc(u.reset)}</button></div></div>`}
/* criteria */
const cs={checked:{}};
function toolCrit(){const l=L(),u=U();let k=0;
  const blocks=l.crit.map((c,ci)=>`<div class="crit"><h4>${ci+1}. ${fmt(c.t)}</h4>${c.d.map((d,di)=>{const id='c'+(k++);return `<label class="dsc"><input type="checkbox" data-cd="${id}" ${cs.checked[st.lesson+'_'+id]?'checked':''}><span>${fmt(d)}</span><span class="pt">1</span></label>`}).join('')}</div>`).join('');
  $('shTool').innerHTML=sheetHead(u.critT)+`<div class="body"><div class="row"><span class="tag">${esc(l.topic.length>48?l.topic.slice(0,46)+'…':l.topic)}</span></div>${blocks}
  <div class="crit"><h4>${esc(u.calc)}</h4><div class="row"><span class="score" id="scVal">0</span><span>/ 11</span><span class="lvl l" id="scLv">${esc(u.lvL)}</span><button class="btn mini" data-ccl style="margin-left:auto">${esc(u.clear)}</button></div><p class="hint">${fmt(DATA[st.lang].meta.levels)}</p></div></div>`;critSum()}
function critSum(){const l=L();let s=0;document.querySelectorAll('#shTool [data-cd]').forEach(c=>{if(c.checked)s++});const e=$('scVal');if(!e)return;e.textContent=s;const lv=$('scLv'),u=U();lv.className='lvl '+(s>=9?'h':s>=6?'m':'l');lv.textContent=s>=9?u.lvH:s>=6?u.lvM:u.lvL}
/* sim */
function simLinks(){return S.get('sim'+st.lesson,[])}
function toolSim(){const l=L(),u=U();const links=simLinks();
  const sug=l.sim?`<a class="btn pri" target="_blank" rel="noopener" href="https://phet.colorado.edu/en/simulations/${esc(l.sim)}">PhET · ${esc(l.sim)} ↗</a>`:`<p class="hint">${esc(u.simNone)}</p>`;
  const q=encodeURIComponent((st.lang==='ru'?'физика 7 класс ':'физика 7 сынып ')+l.topic.split('.')[0]);
  $('shTool').innerHTML=sheetHead(u.simT)+`<div class="body"><div class="crit"><h4>${esc(u.simSug)}</h4>${sug}</div>
  <div class="crit"><h4>${esc(u.simFind)}</h4><div class="row"><a class="btn" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${q}">YouTube ↗</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=vid&q=${q}">Google ↗</a></div></div>
  <div class="crit"><h4>${esc(u.simAdd)}</h4><input type="text" id="smN" placeholder="${esc(u.simName)}" aria-label="${esc(u.simName)}"><input type="url" id="smU" placeholder="${esc(u.simUrl)}" aria-label="url"><button class="btn pri" id="smAdd">${esc(u.add)}</button></div>
  <div class="crit">${links.length?links.map((x,i)=>`<div class="linkrow"><a class="lk" target="_blank" rel="noopener" href="${esc(x.u)}">${esc(x.n||x.u)} ↗</a><button class="btn mini" data-smd="${i}">${esc(u.del)}</button></div>`).join(''):`<p class="hint">${esc(u.simEmpty)}</p>`}</div>
  <p class="hint">${esc(u.simNote)}</p></div>`}
function toolRef(){const u=U();$('shTool').innerHTML=sheetHead(u.refT)+`<div class="body"><div class="crit"><h4>${esc(u.refG)}</h4><div class="tbw"><table class="tb"><tbody><tr><td>g</td><td>≈ 10 Н/кг (9,8)</td></tr><tr><td>p<sub>атм</sub></td><td>760 мм рт. ст. ≈ 101 300 Па</td></tr><tr><td>1 г/см³</td><td>1000 кг/м³</td></tr><tr><td>1 мл</td><td>1 см³ = 10⁻⁶ м³</td></tr><tr><td>1 км/ч</td><td>1 : 3,6 м/с</td></tr>${DENS.map(r=>`<tr><td>ρ ${esc(r[0])}</td><td>${r[1]} кг/м³</td></tr>`).join('')}</tbody></table></div></div>
  <div class="crit"><h4>${esc(u.refP)}</h4><div class="tbw"><table class="tb"><tbody>${PFX.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="crit"><h4>F, p, A, N</h4><p class="mid" style="margin:0">p = F : S &nbsp; p = ρgh &nbsp; F<sub>А</sub> = ρ<sub>ж</sub>gV<br>A = Fs &nbsp; N = A : t &nbsp; M = Fl &nbsp; η = A<sub>п</sub> : A<sub>з</sub></p></div></div>`}
/* ---------- projection ---------- */
function showProj(html){$('projIn').innerHTML=html;$('proj').hidden=false;$('proj').scrollTop=0}
/* ---------- pen ---------- */
const pen={on:false,strokes:[],cur:null,color:'ink',w:5,erase:false};
const PC={ink:null,red:'#e5483a',blue:'#2f7ae5',green:'#2e9e5b',orange:'#f09a1a'};
const cv=$('ink'),cx=cv.getContext('2d');
function inkColor(c){return c==='ink'?getComputedStyle(document.documentElement).getPropertyValue('--fg').trim()||'#000':PC[c]}
function sizeInk(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0);redraw()}
function redraw(){cx.clearRect(0,0,innerWidth,innerHeight);pen.strokes.forEach(drawStroke)}
function drawStroke(s){cx.save();cx.lineCap='round';cx.lineJoin='round';cx.globalCompositeOperation=s.e?'destination-out':'source-over';cx.strokeStyle=s.e?'#000':inkColor(s.c);cx.fillStyle=cx.strokeStyle;cx.lineWidth=s.w;
  const p=s.p;if(p.length===1){cx.beginPath();cx.arc(p[0][0],p[0][1],s.w/2,0,7);cx.fill()}else{cx.beginPath();cx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)cx.lineTo(p[i][0],p[i][1]);cx.stroke()}cx.restore()}
function penBar(){const u=U();const cols=Object.keys(PC);
  $('pen').innerHTML=cols.map((c,i)=>`<button class="sw" data-pc="${c}" aria-label="${esc(u.penColors[i])}" aria-pressed="${!pen.erase&&pen.color===c}" style="background:${c==='ink'?'var(--fg)':PC[c]}"></button>`).join('')
   +`<button class="btn" data-pe aria-pressed="${pen.erase}" ${pen.erase?'style="border-color:var(--accent);background:var(--accent-soft)"':''} aria-label="${esc(u.penE)}">${ic('eraser')}</button>`
   +`<input type="range" id="penW" min="2" max="26" value="${pen.w}" style="width:110px;min-height:44px" aria-label="${esc(u.penW)}">`
   +`<button class="btn" data-pu aria-label="${esc(u.penU)}">${ic('undo')}</button><button class="btn" data-pcl aria-label="${esc(u.penC)}">${ic('trash')}</button><button class="btn pri" data-px>${esc(u.penX)}</button>`}
function penOn(v){pen.on=v;cv.classList.toggle('on',v);$('pen').hidden=!v;if(v)penBar()}
cv.addEventListener('pointerdown',e=>{if(!pen.on)return;cv.setPointerCapture(e.pointerId);pen.cur={c:pen.color,w:pen.erase?pen.w*3:pen.w,e:pen.erase,p:[[e.clientX,e.clientY]]};pen.strokes.push(pen.cur);redraw();e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(!pen.cur)return;(e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>pen.cur.p.push([ev.clientX,ev.clientY]));redraw();e.preventDefault()});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{pen.cur=null}));
addEventListener('resize',sizeInk);
/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('button,a,input,[data-rev]');if(!t)return;const d=t.dataset;
  if(d.sl){goSlide(st.slide+(+d.sl))}
  else if(d.slide!==undefined){goSlide(+d.slide)}
  else if(d.stage!==undefined){setStage(+d.stage)}
  else if(d.go){setStage(st.stage+(+d.go))}
  else if(d.lesson){closeSheets();setLesson(+d.lesson)}
  else if(d.tool){if($('shTool').classList.contains('open')&&$('shTool').dataset.tool===d.tool){closeSheets()}else{closeSheets();openTool(d.tool)}}
  else if(d.close!==undefined||t.id==='scrim'){closeSheets()}
  else if(d.rev){const r=$(d.rev);if(r){r.classList.toggle('show')}}
  else if(d.zoom!==undefined){const c=t.closest('.card');showProj(c.querySelector('.cb').innerHTML)}
  else if(d.pm){pk.mode=d.pm;toolPick()}
  else if(t.id==='pkGo')pkGo();else if(t.id==='pkRst'){pk.pool=null;$('pkOut').textContent='?';$('pkOut').classList.add('go');$('pkLeft').textContent=pickItems().length}
  else if(t.id==='pkMk')pkGroups();
  else if(d.lt){lt[d.lt]++;toolLight()}else if(d.ltm){lt[d.ltm]=Math.max(0,lt[d.ltm]-1);toolLight()}else if(d.ltr!==undefined){lt.g=lt.y=lt.r=0;toolLight()}
  else if(d.cd){cs.checked[st.lesson+'_'+d.cd]=t.checked;critSum()}
  else if(d.ccl!==undefined){Object.keys(cs.checked).forEach(k=>{if(k.startsWith(st.lesson+'_'))delete cs.checked[k]});toolCrit()}
  else if(t.id==='smAdd'){let url=$('smU').value.trim();if(url&&!/^https?:\/\//i.test(url))url='https://'+url;try{new URL(url)}catch(x){toast('URL?');return}const a=simLinks();a.push({n:$('smN').value.trim(),u:url});S.set('sim'+st.lesson,a);toolSim()}
  else if(d.smd!==undefined){const a=simLinks();a.splice(+d.smd,1);S.set('sim'+st.lesson,a);toolSim()}
  else if(d.pc){pen.color=d.pc;pen.erase=false;penBar()}else if(d.pe!==undefined){pen.erase=!pen.erase;penBar()}
  else if(d.pu!==undefined){pen.strokes.pop();redraw()}else if(d.pcl!==undefined){pen.strokes=[];redraw()}else if(d.px!==undefined){penOn(false)}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='penW'){pen.w=+t.value}
  else if(t.id==='pkNames'){S.set('names',t.value);pk.pool=null}
  else if(t.id==='pkCnt'){S.set('count',Math.max(1,Math.min(60,+t.value||25)));pk.pool=null}
});
$('btnLessons').onclick=()=>{renderLessons();openSheet('shLessons')};
$('scrim').onclick=closeSheets;
$('projX').innerHTML=ic('x');$('projX').onclick=()=>{$('proj').hidden=true};
$('lgRu').onclick=()=>{setLang('ru')};$('lgKk').onclick=()=>{setLang('kk')};
function setLang(l){if(l===st.lang)return;st.lang=l;S.set('lang',l);closeSheets();renderTop();renderRail();renderDock();renderStage(true);tmSet(stageMin()*60);if(pen.on)penBar()}
$('btnTheme').onclick=()=>{st.theme=effTheme()==='dark'?'light':'dark';S.set('theme',st.theme);applyTheme();redraw()};
$('btnBoard').onclick=()=>{st.board=!st.board;if(st.board&&st.slides)st.slides=false;renderTop();renderStage()};
$('btnSlides').onclick=()=>{st.slides=!st.slides;if(st.slides){st.board=false;renderTop();goSlide(slideFirstOf(st.stage))}else{renderTop();renderStage()}};
$('btnFull').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){toast('⤢ n/a')}};
$('tGo').onclick=tmToggle;$('tReset').onclick=()=>tmSet(stageMin()*60);
$('tPlus').onclick=()=>{tm.left+=60;tm.total+=60;tmDraw()};$('tMinus').onclick=()=>{tm.left=Math.max(0,tm.left-60);tmDraw()};
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||'')))return;
  if(st.slides&&/^(ArrowRight|ArrowDown|PageDown)$/.test(e.key)){e.preventDefault();goSlide(st.slide+1)}else if(st.slides&&/^(ArrowLeft|ArrowUp|PageUp)$/.test(e.key)){e.preventDefault();goSlide(st.slide-1)}else if(st.slides&&e.key==='Home')goSlide(0);else if(st.slides&&e.key==='End')goSlide(999);
  else if(e.key==='ArrowRight')setStage(st.stage+1);else if(e.key==='ArrowLeft')setStage(st.stage-1);else if(e.key==='Escape'){$('proj').hidden=true;closeSheets()}else if(e.key===' '&&e.target===document.body){e.preventDefault();tmToggle()}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{redraw()});
/* ---------- boot ---------- */
if(!(st.lesson>=1&&st.lesson<=34))st.lesson=1;
applyTheme();sizeInk();renderTop();renderRail();renderDock();renderStage();tmSet(stageMin()*60);
})();
</script>

</body></html>
